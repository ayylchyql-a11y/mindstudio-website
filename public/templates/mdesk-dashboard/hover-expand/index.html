<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M Desk · Espansione al passaggio</title>
<meta name="description" content="Back office di un ristorante, design 05: la barra vive a 72 px e si apre a 240 al passaggio del mouse, le etichette arrivano 80 ms dopo.">
<link rel="stylesheet" href="../assets/core.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigazione">
    <div class="brand"><span class="logo">M</span><span class="lbl"><b>M Desk</b><small>Mumi Sushi</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="user"><span class="avatar">A</span><span class="lbl"><b>Admin</b><small>Turno serale</small></span></div>
    <a class="back lbl" href="/templates/mdesk-dashboard" target="_top">← Tutti gli stili</a>
  </aside>
  <main class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Apri il menu" type="button">☰</button>
      <h1 id="title">Panoramica</h1>
      <span class="chip"><i></i>Normale</span>
      <span class="chip on">⚡ Auto-conferma ON</span>
      <span class="chip">⏱ 912203</span>
      <span class="chip warn"><i></i>Pausa ordini</span>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<script src="../assets/data.js"></script>
<script src="../assets/core.js"></script>
<script src="app.js"></script>

</html>
