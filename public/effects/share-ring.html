<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share ring</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; background: #0b0b0d; color: #f2f2f2; overflow: hidden; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .win { width: min(560px, calc(100% - 32px)); border-radius: 16px; background: #141416; border: 1px solid #ffffff14; box-shadow: 0 30px 60px -30px #000; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ffffff10; font-size: 11px; }
  .bar b { font-weight: 600; } .bar span { color: #8a8a90; }
  .dots { margin-left: auto; display: flex; gap: 5px; } .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .panel { margin: 12px; padding: 14px 16px; border-radius: 10px; background: #0e0e10; background-image: linear-gradient(#ffffff07 1px, transparent 1px), linear-gradient(90deg, #ffffff07 1px, transparent 1px); background-size: 24px 24px; }
  .label { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #6f6f76; }

  .body { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; margin-top: 6px; }
  svg { width: 180px; height: 180px; display: block; overflow: visible; }
  /* each slice is an arc path computed in JS; the draw-in sweeps its end angle and the hover
     push-out moves it along its own mid-angle through the SVG transform attribute */
  .slice { fill: none; stroke-width: 26; cursor: pointer; transition: opacity 200ms; }   /* geometry + push-out drawn in JS, no CSS transforms on SVG */
  svg.pick .slice:not(.out) { opacity: .45; }
  .c1 { text-anchor: middle; fill: #fff; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .c2 { text-anchor: middle; fill: #8a8a90; font-size: 7.5px; letter-spacing: .16em; text-transform: uppercase; }
  .centre { transition: opacity 160ms; } .centre.swap { opacity: 0; }
  .legend { display: grid; gap: 12px; }
  .legend div { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cfcfd4; cursor: pointer; transition: opacity 200ms; }
  .legend.pick div:not(.on) { opacity: .45; }
  .legend div.on { color: #fff; font-weight: 600; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
  @media (max-width: 420px) { .body { grid-template-columns: 1fr; justify-items: center; } }
  @media (prefers-reduced-motion: reduce) { .slice, .centre, .legend div { transition: none; } }
</style>
<div class="win">
  <div class="bar"><b>Insights</b><span>Screen time</span><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div></div>
  <div class="panel">
    <div class="label">Share ring</div>
    <div class="body">
      <svg viewBox="0 0 180 180" id="svg" aria-label="Screen-time share">
        <g id="slices"></g>
        <g class="centre" id="centre"><text class="c1" x="90" y="88" id="c1">5h 12m</text><text class="c2" x="90" y="102" id="c2">Screen time</text></g>
      </svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>
</div>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PARTS = [['Video', 42, '#d9a0b8'], ['Reading', 26, '#f0efe9'], ['Games', 18, '#9a9068'], ['Music', 14, '#6b6b72']];
  const R = 62, C = 2 * Math.PI * R;
  // layout in arc length: one fixed seam (2.5% of the circle) between every pair, and no slice shorter
  // than MIN — a tiny share is pinned to the floor and the bigger ones give up the difference pro rata
  // (the legend and centre keep the true percentages)
  const GAP = C * 0.025, MIN = 8;
  function ringArcs(shares, total, min) {
    const pinned = new Set();
    for (let pass = 0; pass < shares.length; pass++) {
      const free = shares.reduce((a, s, i) => a + (pinned.has(i) ? 0 : s), 0), left = total - pinned.size * min;
      if (!shares.some((s, i) => !pinned.has(i) && s / free * left < min)) return shares.map((s, i) => (pinned.has(i) ? min : s / free * left));
      shares.forEach((s, i) => { if (!pinned.has(i) && s / free * left < min) pinned.add(i); });
    }
    return shares.map(() => total / shares.length);
  }
  const arcs = ringArcs(PARTS.map(([, pct]) => pct / 100), C - GAP * PARTS.length, MIN);
  const svg = document.getElementById('svg'), g = document.getElementById('slices'), legend = document.getElementById('legend');
  const centre = document.getElementById('centre'), c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  // each slice is a plain arc path computed here: no CSS rotate / transform-origin / translate on SVG,
  // which browsers do not agree on — the same ring can explode outward in one engine and be fine in another
  function arcD(cx, cy, r, a0, a1) {           // radians, 0 at 12 o'clock, clockwise
    const sweep = Math.max(1e-4, a1 - a0), b = a0 + sweep, f = (v) => v.toFixed(3);
    return `M${f(cx + r * Math.sin(a0))} ${f(cy - r * Math.cos(a0))}A${r} ${r} 0 ${sweep > Math.PI ? 1 : 0} 1 ${f(cx + r * Math.sin(b))} ${f(cy - r * Math.cos(b))}`;
  }
  function tween(ms, fn) {                      // ease-out, ≈ the old cubic-bezier(.22,.61,.36,1) stroke transition
    const t0 = performance.now();
    const step = (now) => { const t = Math.min(1, (now - t0) / ms); fn(1 - Math.pow(1 - t, 3)); if (t < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  let at = GAP / 2, delay = 0;
  const slices = PARTS.map(([name, pct, col], i) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('stroke', col); el.setAttribute('class', 'slice');
    const len = arcs[i], a0 = at / R, a1 = (at + len) / R, mid = (a0 + a1) / 2;
    at += len + GAP;
    el.addEventListener('pointerenter', () => pick(i)); el.addEventListener('pointerleave', () => pick(-1));
    g.appendChild(el);
    // sequential draw-in: the end angle sweeps out, each slice starting when the previous one finishes
    if (reduce) el.setAttribute('d', arcD(90, 90, R, a0, a1));
    else { el.setAttribute('d', arcD(90, 90, R, a0, a0)); setTimeout(() => tween(600, (e) => el.setAttribute('d', arcD(90, 90, R, a0, a0 + (a1 - a0) * e))), delay); }
    delay += 600 * len / C + 60;
    const l = document.createElement('div'); l.style.setProperty('--c', col); l.innerHTML = `<i></i>${name}<b>${pct}%</b>`;
    l.addEventListener('pointerenter', () => pick(i)); l.addEventListener('pointerleave', () => pick(-1)); legend.appendChild(l);
    return { el, dx: 6 * Math.sin(mid), dy: -6 * Math.cos(mid), k: 0, want: 0 };
  });
  // push-out: 6 units along the slice's middle, eased in JS onto the SVG transform attribute
  let pushing = 0;
  function push() {
    if (pushing) return;
    let last = performance.now();
    const step = (now) => {
      const f = reduce ? 1 : 1 - Math.exp(-(now - last) / 55); last = now; let moving = false;
      slices.forEach((s) => { s.k += (s.want - s.k) * f; if (Math.abs(s.want - s.k) < .002) s.k = s.want; else moving = true; s.el.setAttribute('transform', `translate(${(s.dx * s.k).toFixed(3)} ${(s.dy * s.k).toFixed(3)})`); });
      pushing = moving ? requestAnimationFrame(step) : 0;
    };
    pushing = requestAnimationFrame(step);
  }
  let timer = 0;
  function pick(i) {
    slices.forEach((s, k) => { s.want = k === i ? 1 : 0; s.el.classList.toggle('out', k === i); }); push();
    [...legend.children].forEach((l, k) => l.classList.toggle('on', k === i));
    svg.classList.toggle('pick', i >= 0); legend.classList.toggle('pick', i >= 0);
    // swap the centre text out → in rather than cross-fading two numbers
    clearTimeout(timer); centre.classList.add('swap');
    timer = setTimeout(() => {
      c1.textContent = i < 0 ? '5h 12m' : PARTS[i][1] + '%'; c2.textContent = i < 0 ? 'Screen time' : PARTS[i][0];
      centre.classList.remove('swap');
    }, reduce ? 0 : 160);
  }
  setTimeout(() => pick(1), reduce ? 0 : 1400);
  setTimeout(() => pick(-1), reduce ? 0 : 3400);
</script>
