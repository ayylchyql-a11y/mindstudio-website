<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle sphere dissolve</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #040406; color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .star { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 10px #fff); }
  /* the headline is two HTML words that fade in as the particles let go */
  .h1, .h2 { position: absolute; font-size: 54px; font-weight: 500; letter-spacing: -.03em; line-height: .95; opacity: 0; transition: opacity 900ms 300ms, transform 900ms 300ms cubic-bezier(.22,.61,.36,1); transform: translateY(10px); pointer-events: none; }
  .h1 { left: 28px; top: 22px; } .h2 { right: 28px; bottom: 22px; text-align: right; color: #ffffffb0; }
  .show .h1, .show .h2 { opacity: 1; transform: none; }
  .p { position: absolute; left: 28px; bottom: 28px; max-width: 230px; font-size: 8.5px; line-height: 1.5; color: #ffffff80; opacity: 0; transition: opacity 800ms 600ms; }
  .show .p { opacity: 1; }
  .hint { position: absolute; right: 24px; top: 18px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #ffffff55; }
</style>
<canvas id="c"></canvas>
<span class="star"></span>
<div class="h1">Beyond</div>
<div class="h2">all<br>limits</div>
<p class="p">Superconscious is a neural engine that turns intent into action — anticipating your next move before you make it.</p>
<div class="hint">Click to dissolve</div>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const N = 2600, pts = [];
  // Fibonacci sphere: evenly spread points, no clustering at the poles.
  // Each point also owns a random outward direction + speed for the dissolve.
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    const j = () => (Math.random() - .5) * .06;   // a little jitter so the lattice does not read as a grid
    pts.push({ x: r * Math.cos(th) + j(), y: y + j(), z: r * Math.sin(th) + j(), s: .6 + Math.random() * 1.4, jx: (Math.random() - .5), jy: (Math.random() - .5), hue: 270 + Math.random() * 40 });
  }
  let W, H, R, dpr;
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); R = Math.min(W, H) * .33; };
  size(); addEventListener('resize', size);
  let mx = 0, my = 0, dissolve = 0, target = 0;     // dissolve 0 = sphere, 1 = scattered
  addEventListener('pointermove', (e) => { mx = e.clientX / W * 2 - 1; my = e.clientY / H * 2 - 1; });
  document.addEventListener('click', () => { target = target ? 0 : 1; });
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let rot = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    rot += dt * 0.00018;
    dissolve += (target - dissolve) * (1 - Math.pow(0.001, dt / 1800));   // ~1.8s to settle either way
    document.body.classList.toggle('show', dissolve > .5);
    const d = ease(Math.max(0, Math.min(1, dissolve)));
    ctx.clearRect(0, 0, W, H);
    const cy = Math.cos(rot), sy = Math.sin(rot), tx = my * .35, cx = Math.cos(tx), sx = Math.sin(tx);
    for (const p of pts) {
      // rotate around Y (slow spin + pointer), then X (pointer tilt)
      let x = p.x * cy - p.z * sy, z = p.x * sy + p.z * cy, y = p.y;
      const y2 = y * cx - z * sx; z = y * sx + z * cx; y = y2;
      // dissolve: push each point along its own normal + jitter, and let it
      // drift toward the frame edges; alpha fades so the text underneath reads
      const spread = 1 + d * (1.9 + p.s * .8);
      const px = W / 2 + (x * spread + p.jx * d * 2.2) * R + mx * 14 * (z + 1);
      const py = H / 2 + (y * spread + p.jy * d * 1.6) * R;
      const depth = (z + 1) / 2;                                    // 0 back … 1 front
      const a = (0.18 + depth * 0.7) * (1 - d * .78);
      ctx.fillStyle = `hsla(${p.hue}, 70%, ${55 + depth * 30}%, ${a})`;
      const s = (.6 + depth * 1.3) * p.s * (1 + d * .6);
      ctx.fillRect(px, py, s, s);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // show the whole cycle once without a click
  if (!reduce) { setTimeout(() => target = 1, 2600); setTimeout(() => target = 0, 6400); }
</script>
