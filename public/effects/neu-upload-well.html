<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neumorphic upload well · 新拟态上传组件</title>
<style>
  /* Soft Matter 04 — an upload control in a recessed well. Three file cards (PDF / JPG / DOC) stand in a
     slot above a raised button. Press: the button dents; release: the cards drop into the slot one after
     another (33 ms apart), a progress line fills for 1.34 s (linear) with a live percentage, then a green
     check pops up, the button reads "Uploaded" — and 0.6 s later everything springs back.
     Demo only: no file is read or sent. Card 322×286 CSS px — the reference frame ÷ 3. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; display: grid; place-items: center; background: #e5eaf1;
    font-family: Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .fit { transform: scale(var(--s, 1)); }
  .card { position: relative; width: 322px; height: 286px; border-radius: 23px;
    background: linear-gradient(180deg, #f0f4f7 0%, #ecf1f6 55%, #e7edf4 100%);
    box-shadow: 8px 9px 22px rgb(148 162 184 / .5), -7px -7px 18px rgb(255 255 255 / .75),
      inset 1px 1px 0 rgb(255 255 255 / .9), inset -1px -1px 0 rgb(206 214 226 / .7); }
  .hd { position: absolute; left: 24px; right: 25px; top: 24px; display: flex; justify-content: space-between;
    font-size: 8.8px; line-height: 10px; font-weight: 700; letter-spacing: .12em; color: #646d75; }
  .ft { position: absolute; left: 24px; top: 249.5px; font-size: 9.9px; line-height: 13px; color: #5f6571; }
  .cap { position: absolute; left: 0; right: 0; top: 209px; text-align: center; font-size: 11px; line-height: 13px; font-weight: 700; color: #525d68; }

  /* ── the recessed well ── */
  .well { position: absolute; left: 51.5px; top: 61.5px; width: 219px; height: 135.5px; border-radius: 24px;
    background: linear-gradient(180deg, #dfe5ee 0%, #e4e9f1 50%, #e9eef5 100%);
    box-shadow: inset 7px 8px 14px rgb(146 162 188 / .55), inset -6px -6px 12px rgb(255 255 255 / .95); }

  /* the slot the files drop into: a thin dark lens */
  .slot { position: absolute; left: 109px; top: 109.6px; width: 104px; height: 3.4px; border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, #9eabbb 0%, #b0bccb 65%, rgb(184 195 208 / 0) 100%); filter: blur(.3px); }
  .files { position: absolute; left: 0; top: 0; width: 322px; height: 112px; overflow: hidden; pointer-events: none; }
  .file { position: absolute; top: 72.5px; width: 27.5px; height: 39px; border-radius: 5px; padding-top: 15px; text-align: center;
    font-size: 7px; line-height: 9px; font-weight: 700; letter-spacing: .02em; color: #4f5a66;
    background: linear-gradient(160deg, #fbfcfe 0%, #f1f4f8 70%, #e8edf3 100%);
    box-shadow: 2px 3px 6px rgb(146 162 188 / .45), -1px -1px 2px rgb(255 255 255 / .9);
    transition: translate 150ms cubic-bezier(.5, 0, .9, .6), opacity 150ms ease-in, filter 150ms ease-in, scale 150ms ease-in; }
  .file:nth-child(1) { left: 117px; rotate: -6deg; transition-delay: 0ms; }
  .file:nth-child(2) { left: 147.3px; top: 71px; rotate: 0deg; z-index: 1; transition-delay: 33ms; }
  .file:nth-child(3) { left: 176.6px; rotate: 6.5deg; transition-delay: 66ms; }
  .busy .file, .done .file { translate: 0 30px; scale: .82; opacity: 0; filter: blur(1.5px); }
  .reset .file { transition-timing-function: cubic-bezier(.2, .7, .3, 1), ease-out, ease-out, cubic-bezier(.2, .7, .3, 1); transition-duration: 120ms; }

  /* the check that pops up when it is done */
  .ok { position: absolute; left: 147.6px; top: 81.6px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #e3ecdf 0%, #d6e3d4 70%, #cfdccc 100%);
    box-shadow: inset 1.5px 2px 3px rgb(140 160 140 / .35), inset -1px -1px 2px rgb(255 255 255 / .8), 0 1px 1px rgb(255 255 255 / .7);
    opacity: 0; scale: .55; transition: opacity 90ms ease-out, scale 110ms cubic-bezier(.3, 1.4, .5, 1); }
  .ok svg { position: absolute; left: 6.6px; top: 6.4px; }
  .done .ok { opacity: 1; scale: 1; }

  /* ── the button ── */
  .go { position: absolute; left: 92px; top: 123px; width: 138.5px; height: 34px; border-radius: 13px; outline: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 10.6px; font-weight: 700; color: #548696; padding-bottom: 3px;
    background: linear-gradient(180deg, #f5f7fa 0%, #eef2f6 55%, #e7ecf2 100%);
    box-shadow: 6px 7px 12px rgb(146 161 184 / .5), -5px -5px 10px rgb(255 255 255 / .95), inset 1px 1px 1px rgb(255 255 255 / .9);
    transition: box-shadow 90ms ease-out, scale 90ms ease-out, background 90ms ease-out; }
  .go:focus-visible { outline: 2px solid #5694a8; outline-offset: 3px; }
  .go .arr { font-size: 14px; font-weight: 400; line-height: 1; translate: 0 -.5px; }
  .go.down { scale: .97; background: linear-gradient(180deg, #e2e8f0 0%, #e8edf3 60%, #eef2f7 100%);
    box-shadow: 0 0 0 rgb(146 161 184 / 0), 0 0 0 rgb(255 255 255 / 0), inset 4px 5px 8px rgb(146 161 184 / .5), inset -3px -3px 7px rgb(255 255 255 / .95); }
  .go[aria-disabled="true"] { cursor: default; }

  /* ── progress ── */
  .prog { position: absolute; left: 100px; top: 166px; width: 120px; height: 5px; border-radius: 2.5px; opacity: 0;
    background: #d8dfe8; box-shadow: inset .5px 1px 1.5px rgb(140 155 180 / .45), 0 .5px 0 rgb(255 255 255 / .9);
    transition: opacity 70ms linear; }
  .prog b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2.5px; background: #5694a8; }
  .busy .prog { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .file, .ok, .go, .prog { transition: none; } }
</style>
</head>
<body>
<div class="fit" id="fit">
  <article class="card" id="card">
    <div class="hd"><span>04 / TRANSFER</span><span>CLOUD</span></div>
    <div class="well"></div>
    <div class="slot"></div>
    <div class="files" aria-hidden="true"><div class="file">PDF</div><div class="file">JPG</div><div class="file">DOC</div></div>
    <div class="ok" aria-hidden="true"><svg width="13.6" height="13.6" viewBox="0 0 12 12"><path d="M1.4 6.6 L4.6 9.9 L10.8 1.6" fill="none" stroke="#6a806c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <button class="go" id="go"><span class="arr">↑</span><span id="lbl">Upload files</span></button>
    <div class="prog"><b id="fill"></b></div>
    <div class="cap" id="cap" aria-live="polite">Ready when you are</div>
    <div class="ft">Demo only · No files are uploaded</div>
  </article>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), go = $("go"), lbl = $("lbl"), cap = $("cap"), fill = $("fill");
  const FILL = 1340, HOLD = 600; // linear fill; the check stays this long before the reset
  let phase = "idle", t0 = 0, raf = 0, timer = 0;

  function start() {
    phase = "busy"; card.classList.remove("reset", "done"); card.classList.add("busy");
    go.setAttribute("aria-disabled", "true"); lbl.textContent = "Transferring";
    t0 = performance.now(); raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    const p = Math.min(1, (now - t0) / FILL);
    fill.style.width = p * 120 + "px";
    cap.textContent = Math.round(p * 100) + "% · Simulating transfer";
    if (p < 1) { raf = requestAnimationFrame(tick); return; }
    phase = "done"; lbl.textContent = "Uploaded"; cap.textContent = "Demo complete";
    card.classList.add("done"); card.classList.remove("busy");
    timer = setTimeout(reset, HOLD);
  }
  function reset() {
    phase = "idle"; card.classList.add("reset"); card.classList.remove("done", "busy");
    fill.style.width = "0px"; go.removeAttribute("aria-disabled");
    lbl.textContent = "Upload files"; cap.textContent = "Ready when you are";
  }

  const press = () => { if (phase === "idle") go.classList.add("down"); };
  const release = (commit) => {
    if (!go.classList.contains("down")) return;
    go.classList.remove("down");
    if (commit) start();
  };
  go.addEventListener("pointerdown", (e) => { if (e.button === 0) { go.setPointerCapture(e.pointerId); press(); } });
  go.addEventListener("pointerup", (e) => {
    const r = go.getBoundingClientRect();
    release(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
  });
  go.addEventListener("pointercancel", () => release(false));
  go.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(); } });
  go.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(true); });
  go.addEventListener("click", (e) => { if (e.detail === 0 && !e.isTrusted) { press(); setTimeout(() => release(true), 167); } });

  const q = location.search, fitEl = $("fit");
  const fit = () => fitEl.style.setProperty("--s", /[?&]cmp\b/.test(q) ? 1 : Math.min(1.5, (innerWidth - 48) / 322, (innerHeight - 48) / 286));
  addEventListener("resize", fit); fit();
  // for frame comparisons: freeze at a progress value (0–1) or in the done state
  window.__upload = { at(p) { cancelAnimationFrame(raf); clearTimeout(timer); card.classList.add("busy"); lbl.textContent = "Transferring"; fill.style.width = p * 120 + "px"; cap.textContent = Math.round(p * 100) + "% · Simulating transfer"; },
    done() { cancelAnimationFrame(raf); card.classList.remove("busy"); card.classList.add("done"); lbl.textContent = "Uploaded"; cap.textContent = "Demo complete"; }, press, release };

  // ?demo: press, wait for the reset, press again (the recording's rhythm: one cycle every 2.43 s)
  if (/[?&]demo\b/.test(q)) {
    const ids = [], tap = (at) => ids.push(setTimeout(press, at), setTimeout(() => release(true), at + 167));
    [500, 2930, 5360].forEach(tap);
    addEventListener("pointerdown", (e) => { if (e.isTrusted) ids.forEach(clearTimeout); }, { once: true, capture: true });
  }
})();
</script>
</body>
</html>
