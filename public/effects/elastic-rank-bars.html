<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elastic ranks · 弹性排序柱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0a0a0c; display: grid; place-items: center; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4f4f6;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }

  /* Laid out at a fixed 470 × 470 and scaled to fit, so every number below is in card pixels. */
  .fit { width: calc(470px * var(--k, 1)); height: calc(470px * var(--k, 1)); }
  .card { position: relative; width: 470px; height: 470px; transform: scale(var(--k, 1)); transform-origin: 0 0;
    border-radius: 28px; background: linear-gradient(135deg, #131419, #0f1014 70%); border: 1px solid #ffffff0d; overflow: hidden; }

  .kicker { position: absolute; left: 32px; top: 29px; display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; letter-spacing: .125em; text-transform: uppercase; color: #f7a65c; }
  .kicker i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .live { position: absolute; right: 34px; top: 30px; font-size: 11.5px; letter-spacing: .16em; color: #6c6c70; }
  .num { position: absolute; left: 32px; top: 71px; display: flex; align-items: baseline; gap: 13px; }
  .num b { font-size: 54px; font-weight: 300; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
  .num span { position: relative; top: -3px; font-size: 12.5px; color: #a9a9ae; }
  .tag { position: absolute; right: 34px; top: 87px; font-size: 12.5px; letter-spacing: .03em; color: #f7a65c; }

  svg.grid { position: absolute; left: 0; top: 0; width: 470px; height: 470px; }
  .grid line { stroke: #ffffff17; stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 0 7; }
  .chart { position: absolute; left: 0; top: 0; width: 470px; height: 380px; cursor: pointer; }
  /* one column = bar + value above + day below; it moves as a unit, so the labels can't lose their bar */
  .col { position: absolute; left: 0; top: 0; width: 41px; will-change: transform; }
  .bar { position: absolute; left: 0; bottom: 0; width: 41px; border-radius: 7px; background: #ff8838; }
  .col.top .bar { background: #fecb8e; }
  .v { position: absolute; left: -10px; width: 61px; text-align: center; font-size: 12px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .d { position: absolute; left: -10px; width: 61px; top: 17px; text-align: center; font-size: 12px; color: #b9b9bf; }

  .rule { position: absolute; left: 34px; right: 34px; top: 390px; height: 1px; background: #ffffff14; }
  .foot { position: absolute; left: 34px; right: 34px; top: 409px; display: flex; justify-content: space-between; font-size: 13px; color: #b3b3b8; }
  .foot span:last-child { font-size: 11.5px; letter-spacing: .03em; color: #a5a5aa; }
</style>
</head>
<body>
<div class="fit">
  <div class="card" id="card">
    <div class="kicker"><i></i>03 / Elastic ranks</div>
    <div class="live">LIVE LOOP</div>
    <div class="num"><b id="total">0</b><span>sessions</span></div>
    <div class="tag">WEEK 42</div>
    <svg class="grid" viewBox="0 0 470 470"><line x1="75" x2="395" y1="192" y2="192"/><line x1="75" x2="395" y1="265" y2="265"/><line x1="75" x2="395" y1="338" y2="338"/></svg>
    <div class="chart" id="chart" role="button" aria-label="Sort the week"></div>
    <div class="rule"></div>
    <div class="foot"><span id="status">Growing into a new order</span><span>TAP TO SORT ↗</span></div>
  </div>
</div>
<script>
(() => {
  const DAYS = [["M", 48], ["T", 75], ["W", 94], ["T", 57], ["F", 68]];
  const SLOT0 = 84, PITCH = 63, BASE = 338, PX = 1.67;          // bar left edge, slot pitch, baseline, px per session
  // The loop, read off the reference (seconds): grow 3 s; the columns start sliding to their
  // ranks 1.86 s in and take 1.45 s; hold; shrink 1.35 s while sliding back to day order.
  const GROW = 3.0, MOVE_AT = 1.86, MOVE = 1.45, SHRINK_AT = 5.9, SHRINK = 1.35, CYCLE = 7.35;
  const IDLE = 4000;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const sine = (x) => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2;
  const SUM = DAYS.reduce((s, d) => s + d[1], 0);
  const rank = DAYS.map((_, i) => i).sort((a, b) => DAYS[b][1] - DAYS[a][1]);   // slot → day
  const rankSlot = DAYS.map((_, i) => rank.indexOf(i));                           // day → slot
  const max = Math.max(...DAYS.map((d) => d[1]));

  const chart = $("chart"), total = $("total"), status = $("status");
  const cols = DAYS.map(([d, v]) => {
    const c = document.createElement("div");
    c.className = "col" + (v === max ? " top" : "");
    c.style.zIndex = v;                                   // taller columns pass in front of shorter ones
    c.innerHTML = `<div class="bar"></div><div class="v"></div><div class="d">${d}</div>`;
    chart.appendChild(c);
    return { el: c, bar: c.firstChild, v: c.children[1], v0: v, last: "" };
  });

  function draw(p, q) {
    cols.forEach((c, i) => {
      const x = SLOT0 + PITCH * (i + (rankSlot[i] - i) * q);
      const h = c.v0 * PX * p;
      c.el.style.transform = `translate(${x.toFixed(2)}px, ${BASE}px)`;
      c.bar.style.height = h.toFixed(2) + "px";
      c.v.style.top = (-h - 31).toFixed(2) + "px";
      const n = String(Math.round(c.v0 * p));
      if (n !== c.last) { c.v.textContent = n; c.last = n; }
    });
    const t = String(Math.round(SUM * p));
    if (total.textContent !== t) total.textContent = t;
    const s = p > 0.995 && q > 0.995 ? "Ranked by activity" : p > 0.995 && q < 0.005 ? "Back in day order" : "Growing into a new order";
    if (status.textContent !== s) status.textContent = s;
  }

  let t0 = null, manual = null, qShrink = 1;
  const loopAt = (tau) => tau < SHRINK_AT
    ? { p: sine(tau / GROW), q: sine((tau - MOVE_AT) / MOVE) }
    : { p: 1 - sine((tau - SHRINK_AT) / SHRINK), q: qShrink * (1 - sine((tau - SHRINK_AT) / SHRINK)) };
  let cur = { p: 0, q: 0 };

  function frame(now) {
    if (t0 === null) t0 = now;
    if (manual) {
      const k = (now - manual.at) / 1000;
      cur = { p: manual.p0 + (1 - manual.p0) * (1 - Math.pow(1 - Math.min(1, k / 0.5), 3)),
              q: manual.q0 + (manual.q1 - manual.q0) * sine(k / (MOVE * Math.abs(manual.q1 - manual.q0) || 1)) };
      if (now - manual.at > IDLE + MOVE * 1000) {           // carry on into the shrink from wherever it stands
        qShrink = cur.q; manual = null; t0 = now - SHRINK_AT * 1000;
      }
    } else {
      let tau = (now - t0) / 1000;
      if (tau >= CYCLE) { t0 += CYCLE * 1000; tau -= CYCLE; qShrink = 1; }
      cur = loopAt(tau);
    }
    draw(cur.p, cur.q);
    requestAnimationFrame(frame);
  }

  // TAP TO SORT: flip between day order and rank order (finishing the growth first if needed).
  chart.addEventListener("click", () => {
    const q1 = cur.q > 0.5 ? 0 : 1;
    if (reduce) { cur = { p: 1, q: q1 }; return draw(1, q1); }
    manual = { at: performance.now(), p0: cur.p, q0: cur.q, q1 };
  });

  if (reduce) { cur = { p: 1, q: 1 }; draw(1, 1); }
  else requestAnimationFrame(frame);

  const fit = () => document.documentElement.style.setProperty("--k", Math.min(1, (innerWidth - 24) / 470, (innerHeight - 24) / 470));
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
