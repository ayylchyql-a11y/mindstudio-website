<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current study · 流量曲线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0a0a0c; display: grid; place-items: center; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4f4f6;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }

  /* Laid out at a fixed 720 × 405 and scaled to fit, so every number below is in card pixels. */
  .fit { width: calc(720px * var(--k, 1)); height: calc(405px * var(--k, 1)); }
  .card { position: relative; width: 720px; height: 405px; transform: scale(var(--k, 1)); transform-origin: 0 0;
    border-radius: 24px; background: linear-gradient(135deg, #131419, #0f1014 70%); border: 1px solid #ffffff0d; overflow: hidden; }

  .kicker { position: absolute; left: 22px; top: 23px; display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: .19em; text-transform: uppercase; color: #5ec4f0; }
  .kicker i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .live { position: absolute; right: 25px; top: 24px; font-size: 9.5px; letter-spacing: .18em; color: #6c6c70; }
  .num { position: absolute; left: 24px; top: 54px; display: flex; align-items: baseline; gap: 10px; }
  .num b { font-size: 60px; font-weight: 300; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
  .num span { font-size: 11px; color: #a9a9ae; }
  .tag { position: absolute; right: 25px; top: 70px; text-align: right; font-size: 10px; line-height: 15.4px; color: #5ec4f0; }

  svg.plot { position: absolute; left: 0; top: 0; width: 720px; height: 405px; overflow: visible; }
  .grid line { stroke: #ffffff17; stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 0 7; }
  #line { fill: none; stroke: #62c6f2; stroke-width: 2.6; stroke-linejoin: round; filter: drop-shadow(0 0 3px #3fb6f066); }
  #guide { stroke: #4b8fb2; stroke-width: 1; stroke-dasharray: 3 3; }
  .hit { cursor: ew-resize; touch-action: none; }

  .pill { position: absolute; left: 0; top: 0; width: 61px; height: 24px; margin: -35px 0 0 -30.5px; border-radius: 6px;
    background: #39c1fb; color: #0b2637; font-size: 10px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
    pointer-events: none; will-change: transform; }

  .xl { position: absolute; top: 330px; font-size: 10.5px; color: #c6c6cb; }
  .rule { position: absolute; left: 25px; right: 25px; top: 354px; height: 1px; background: #ffffff14; }
  .foot { position: absolute; left: 25px; right: 25px; top: 367px; display: flex; justify-content: space-between; font-size: 10px; color: #b3b3b8; }
  .foot span:last-child { font-size: 9.5px; letter-spacing: .06em; color: #a5a5aa; }
</style>
</head>
<body>
<div class="fit">
  <div class="card" id="card">
    <div class="kicker"><i></i>02 / Current study</div>
    <div class="live">LIVE LOOP</div>
    <div class="num"><b id="val">20.0</b><span>L / min</span></div>
    <div class="tag">RIVER STATION 04<br>FLOW VELOCITY</div>

    <svg class="plot" viewBox="0 0 720 405" aria-label="Flow velocity through the day">
      <defs>
        <!-- objectBoundingBox: the fade always spans the area's own height,
             so a flat line still has its thin glowing band underneath -->
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a9fd6" stop-opacity=".26"/>
          <stop offset="1" stop-color="#3a9fd6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="grid"><line x1="90" x2="628" y1="158" y2="158"/><line x1="90" x2="628" y1="213" y2="213"/><line x1="90" x2="628" y1="268" y2="268"/></g>
      <path id="area" fill="url(#fill)"/>
      <path id="line"/>
      <line id="guide" y2="312"/>
      <circle id="halo" r="9" fill="#ffffff1c"/>
      <circle id="dot" r="4.6" fill="#fff"/>
      <rect class="hit" id="hit" x="80" y="140" width="558" height="180" fill="transparent"/>
    </svg>
    <div class="pill" id="pill">20.0</div>

    <span class="xl" style="left:92px">06:00</span>
    <span class="xl" style="left:362px;transform:translateX(-50%)">12:00</span>
    <span class="xl" style="right:98px">18:00</span>
    <div class="rule"></div>
    <div class="foot"><span>A moving cross-section of the day</span><span>DRAG TO INSPECT ↗</span></div>
  </div>
</div>
<script>
(() => {
  // ── the curve ───────────────────────────────────────────────────────────
  // 13 hourly readings (06:00 … 18:00) above a 20 L/min floor, each drifting slowly
  // so the shape keeps moving while you look at it. Fitted to the reference frames.
  const BASE  = [37.3, 37.4, 24.1, 18.9, 20.9, 14.7, 8.9, 21.6, 41.1, 44.7, 36.0, 35.8, 36.3];
  const DRIFT = [-0.9, -3.5, -4.9, -5.0, -4.0, -1.4, 1.5, 2.2, 0.5, -1.5, -2.0, -2.1, -2.3]; // L/min per second
  const X0 = 90, X1 = 628, STEP = (X1 - X0) / 12, FLOOR = 20, Y_FLOOR = 288, PX = 2.372; // px per L/min
  const yOf = (v) => Y_FLOOR - (v - FLOOR) * PX;

  // ── the loop (seconds) ──────────────────────────────────────────────────
  // probe sweeps 06:00 → 18:00 while the curve rises out of the floor; it waits at 18:00,
  // the curve settles back to a flat line, the probe jumps home, again.
  const SWEEP = 4.6, RISE = 3.75, FALL_AT = 5.02, FALL = 1.35, JUMP_AT = 6.55, CYCLE = 6.95;
  const IDLE = 2500;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const line = $("line"), area = $("area"), guide = $("guide"), dot = $("dot"), halo = $("halo"), pill = $("pill"), val = $("val");
  const sine = (x) => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2;
  const outSine = (x) => Math.sin(Math.PI / 2 * Math.min(1, Math.max(0, x)));

  // Catmull-Rom through the readings, sampled every 3 px; the same function answers the probe.
  let pts = BASE.slice();
  function valueAt(x, amp) {
    const s = Math.min(12, Math.max(0, (x - X0) / STEP)), i = Math.min(11, Math.floor(s)), u = s - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(12, i + 2)];
    const h = 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
    return FLOOR + amp * h;
  }
  function draw(amp, shapeT, probeX) {
    const d = Math.min(1.6, Math.max(-1.8, shapeT - 3.36));
    pts = BASE.map((b, i) => b + DRIFT[i] * d);
    let p = "";
    for (let x = X0; x <= X1 + 0.1; x += 3) p += (p ? "L" : "M") + x.toFixed(1) + " " + yOf(valueAt(Math.min(x, X1), amp)).toFixed(2);
    line.setAttribute("d", p);
    area.setAttribute("d", p + `L${X1} 300L${X0} 300Z`);
    const v = valueAt(probeX, amp), y = yOf(v);
    guide.setAttribute("x1", probeX); guide.setAttribute("x2", probeX); guide.setAttribute("y1", y);
    dot.setAttribute("cx", probeX); dot.setAttribute("cy", y); halo.setAttribute("cx", probeX); halo.setAttribute("cy", y);
    pill.style.transform = `translate(${Math.min(X1 - 28, Math.max(X0 + 29.5, probeX))}px, ${y}px)`;   // the tag stays inside the plot
    const txt = v.toFixed(1);
    if (val.textContent !== txt) { val.textContent = txt; pill.textContent = txt; }
  }

  let t0 = null, shape0 = null, drag = null, lastTouch = -1e9, floorA = 0, hold = null;
  const probeOf = (tau) => tau >= JUMP_AT ? X0 : X0 + (X1 - X0) * sine(tau / SWEEP);
  function ampOf(tau) {
    if (tau < FALL_AT) return Math.max(outSine(tau / RISE), floorA);
    return 1 - sine((tau - FALL_AT) / FALL);
  }

  function frame(now) {
    if (t0 === null) { t0 = now; shape0 = now; }
    if (hold) {                                         // dragging, or waiting after a drag
      hold.amp += (1 - hold.amp) * 0.12;
      draw(hold.amp, (now - shape0) / 1000, hold.x);
      if (!drag && now - lastTouch > IDLE) {            // pick the sweep up from where the probe is
        const u = (hold.x - X0) / (X1 - X0);
        const tau = SWEEP * Math.acos(1 - 2 * u) / Math.PI;
        floorA = hold.amp; t0 = now - tau * 1000; hold = null;
      }
    } else {
      let tau = (now - t0) / 1000;
      if (tau >= CYCLE) { t0 += CYCLE * 1000; tau -= CYCLE; floorA = 0; shape0 = now - tau * 1000; }
      draw(ampOf(tau), (now - shape0) / 1000, probeOf(tau));
    }
    requestAnimationFrame(frame);
  }

  // DRAG TO INSPECT: the probe follows the pointer; the curve rises to full and keeps flowing.
  const hit = $("hit"), card = $("card");
  function toX(e) {
    const r = card.getBoundingClientRect(), k = r.width / 720;
    return Math.min(X1, Math.max(X0, (e.clientX - r.left) / k));
  }
  function startHold(x) {
    if (!hold) {
      const tau = ((performance.now() - t0) / 1000) % CYCLE;
      hold = { amp: reduce ? 1 : ampOf(tau), x };
    }
    hold.x = x; lastTouch = performance.now();
    if (reduce) draw(1, 3.36, x);
  }
  hit.addEventListener("pointerdown", (e) => { drag = e.pointerId; hit.setPointerCapture(e.pointerId); startHold(toX(e)); });
  hit.addEventListener("pointermove", (e) => { if (drag === e.pointerId) startHold(toX(e)); });
  const end = (e) => { if (drag === e.pointerId) { drag = null; lastTouch = performance.now(); } };
  hit.addEventListener("pointerup", end); hit.addEventListener("pointercancel", end);

  if (reduce) draw(1, 3.36, X0 + (X1 - X0) * 0.89);
  else requestAnimationFrame(frame);

  const fit = () => document.documentElement.style.setProperty("--k", Math.min(1, (innerWidth - 24) / 720, (innerHeight - 24) / 405));
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
