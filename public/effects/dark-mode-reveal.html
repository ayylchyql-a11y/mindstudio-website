<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark mode · the circle from the switch</title>
<link rel="stylesheet" href="_glass/glass.css">
<style>
  .stage { position: relative; width: min(391px, calc(100vw - 24px)); height: 262px; }
  .stage > .card { position: absolute; inset: 0; width: auto; }
  /* the dark copy sits on top and is revealed through a growing circle */
  .card.dark { background: #161218; border-color: rgb(255 255 255 / .06); clip-path: circle(var(--r, 0px) at var(--x, 85%) var(--y, 36%)); }
  .rows { margin-top: 11px; display: grid; gap: 9px; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 14px; border-radius: 12px; font-size: 13.5px; font-weight: 600; text-align: left; width: 100%;
    background: rgb(251 248 249 / .96); color: #1c181e; }
  .row svg.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row .v { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: #8a858e; }
  .row .v svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .dark .row { background: #231f25; color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .04); }
  .dark .row svg.ic { color: #8b7ff0; }
  .dark .row .v { color: #b7b3bb; }
  .sw { margin-left: auto; position: relative; width: 42px; height: 24px; border-radius: 12px; background: #d6d2d9; transition: background-color .22s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .22s cubic-bezier(.3, .7, .2, 1); }
  .sw[aria-checked="true"] { background: #9183f5; } .sw[aria-checked="true"]::after { transform: translateX(18px); }
  .dark .sw { background: #4a4450; } .dark .sw[aria-checked="true"] { background: #9183f5; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <main class="card light" aria-hidden="false"></main>
  <main class="card dark" aria-hidden="true"></main>
</div>
<script>
(() => {
  const stage = document.getElementById("stage"), light = stage.querySelector(".light"), dark = stage.querySelector(".dark");
  const MOON = '<svg class="ic" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>';
  const AA = '<svg class="ic" viewBox="0 0 24 24"><path d="m2 19 5-13 5 13M3.8 15h6.4M14 19l3.5-8.5L21 19M15.3 16.2h4.4"/></svg>';
  const SND = '<svg class="ic" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>';
  const st = { dark: false, sounds: true };
  let r = 0, anim = null;
  const tpl = (on) => `<header><h2>Settings</h2><p>Appearance</p></header>
    <div class="rows">
      <div class="row">${MOON}Dark mode<button type="button" class="sw" role="switch" data-k="dark" aria-label="Dark mode"></button></div>
      <button type="button" class="row">${AA}Text size<span class="v">Medium<svg viewBox="0 0 12 12"><path d="m4.5 2.5 3.5 3.5-3.5 3.5"/></svg></span></button>
      <div class="row">${SND}Sounds<button type="button" class="sw" role="switch" data-k="sounds" aria-label="Sounds"></button></div>
    </div>`;
  light.innerHTML = tpl(); dark.innerHTML = tpl();
  const sync = () => stage.querySelectorAll(".sw").forEach((s) => s.setAttribute("aria-checked", String(st[s.dataset.k])));

  // the circle starts on the switch's knob and must reach the farthest corner of the card
  function origin() {
    const sw = light.querySelector('[data-k="dark"]').getBoundingClientRect(), c = stage.getBoundingClientRect();
    const x = sw.left + sw.width - 12 - c.left, y = sw.top + sw.height / 2 - c.top;
    const R = Math.max(Math.hypot(x, y), Math.hypot(c.width - x, y), Math.hypot(x, c.height - y), Math.hypot(c.width - x, c.height - y)) + 2;
    return { x, y, R };
  }
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);   // slow start, quick middle, soft landing
  function reveal(toDark) {
    const { x, y, R } = origin(), from = r, to = toDark ? R : 0;
    dark.style.setProperty("--x", x + "px"); dark.style.setProperty("--y", y + "px");
    const dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : toDark ? 1250 : 700, delay = 120, t0 = performance.now() + delay;
    cancelAnimationFrame(anim);
    const step = (now) => { const k = Math.min(1, Math.max(0, (now - t0) / dur)); r = from + (to - from) * ease(k); dark.style.setProperty("--r", r + "px"); if (k < 1) anim = requestAnimationFrame(step); else done(toDark); };
    anim = requestAnimationFrame(step);
  }
  function done(isDark) { light.setAttribute("aria-hidden", String(isDark)); dark.setAttribute("aria-hidden", String(!isDark)); light.inert = isDark; dark.inert = !isDark; }
  stage.addEventListener("click", (e) => {
    const s = e.target.closest(".sw"); if (!s) return;
    st[s.dataset.k] = !st[s.dataset.k]; sync();
    if (s.dataset.k === "dark") reveal(st.dark);
  });
  sync(); done(false);

  /* ?demo (recording only): on, off, on */
  if (/[?&]demo\b/.test(location.search)) {
    const tap = () => (st.dark ? dark : light).querySelector('[data-k="dark"]').click();
    [[700, tap], [3200, tap], [5600, tap]].forEach(([ms, fn]) => setTimeout(fn, ms));
  }
})();
</script>
</body>
</html>
