<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus timer · the bar that grows</title>
<link rel="stylesheet" href="_glass/glass.css">
<style>
  .card { min-height: 262px; }
  .tasks { margin-top: 66px; display: grid; gap: 7px; transition: opacity .3s var(--ease); }
  .task { display: flex; align-items: center; gap: 9px; height: 35px; padding: 0 12px 0 11px; text-align: left; transition: border-color .25s, background-color .25s; }
  .task .ck { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .85); transition: background-color .2s, border-color .2s; }
  .task .ck svg { width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s var(--spring); }
  .task.done .ck { background: var(--teal); border-color: var(--teal); } .task.done .ck svg { opacity: 1; transform: none; }
  .task b { flex: 1; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
  .task.done b { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .75; }
  .task span { font-size: 11.5px; opacity: .85; }
  .task.active { border-color: rgb(47 165 154 / .9); box-shadow: inset 0 0 0 .5px rgb(47 165 154 / .9); }
  .task:not(.done):hover { background: rgb(255 255 255 / .22); }
  .card.open .tasks { opacity: .38; }

  /* the island: one element whose box moves between three sizes; each state's contents fade in on top */
  .island { position: absolute; z-index: 2; top: 66px; left: calc(50% - 64px); width: 128px; height: 32px; border-radius: 16px;
    background: rgb(44 38 36 / .9); box-shadow: 0 10px 24px -12px rgb(0 0 0 / .55); overflow: hidden; cursor: pointer;
    transition: left .42s cubic-bezier(.32, .72, 0, 1), width .42s cubic-bezier(.32, .72, 0, 1), height .42s cubic-bezier(.32, .72, 0, 1), border-radius .42s cubic-bezier(.32, .72, 0, 1), opacity .25s; }
  .island.wide { left: 18px; width: calc(100% - 36px); height: 46px; border-radius: 23px; }
  .island.expanded { left: 18px; width: calc(100% - 36px); height: 146px; border-radius: 20px; cursor: default; }
  .island.gone { opacity: 0; pointer-events: none; }
  .island > div { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .island.compact .c, .island.wide .w, .island.expanded .k { opacity: 1; transition: opacity .25s .12s; pointer-events: auto; }
  .ring { display: block; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.4; }
  .ring .bg { stroke: rgb(255 255 255 / .16); } .ring .fg { stroke: var(--teal); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
  .c { display: flex; align-items: center; padding: 0 16px 0 8px; }
  .c .t { margin-left: auto; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .w { display: flex; align-items: center; gap: 10px; padding: 0 9px 0 11px; }
  .w b { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w .t { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .w .pp { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgb(255 255 255 / .14); }
  .pp svg { width: 9px; height: 9px; fill: #fff; }
  .k { padding: 14px 14px 12px; }
  .k .lb { display: flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; opacity: .86; }
  .k .lb i { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); }
  .k .big { margin-top: 3px; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .k .bar { margin-top: 9px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .14); overflow: hidden; }
  .k .bar i { display: block; height: 100%; background: var(--teal); border-radius: inherit; transition: width .9s linear; }
  .k .btns { margin-top: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .k .btns button { height: 32px; border-radius: 16px; font-size: 12px; font-weight: 600; transition: transform .12s, background-color .2s; }
  .k .btns button:active { transform: scale(.97); }
  .k .pause { background: #f4f2f3; color: var(--ink); } .k .end { background: rgb(255 255 255 / .1); }
</style>
</head>
<body>
<main class="card" id="card" aria-label="Today">
  <header><h2>Today</h2><p>3 tasks · focus</p></header>
  <div class="island compact" id="island" role="button" tabindex="0" aria-label="Focus timer">
    <div class="c"><svg class="ring" width="18" height="18" viewBox="0 0 18 18"><circle class="bg" cx="9" cy="9" r="7.6"/><circle class="fg" cx="9" cy="9" r="7.6"/></svg><span class="t"></span></div>
    <div class="w"><svg class="ring" width="22" height="22" viewBox="0 0 22 22"><circle class="bg" cx="11" cy="11" r="9.6"/><circle class="fg" cx="11" cy="11" r="9.6"/></svg><b class="nm"></b><span class="t"></span><span class="pp" aria-hidden="true"></span></div>
    <div class="k"><div class="lb"><i></i><span class="nm"></span></div><div class="big t"></div><div class="bar"><i></i></div>
      <div class="btns"><button type="button" class="pause">Pause</button><button type="button" class="end">End</button></div></div>
  </div>
  <div class="tasks" id="tasks">
    <button type="button" class="task glass-row done" data-min="25"><span class="ck"><svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.3 2.3 4.7-4.9"/></svg></span><b>Sketch the layout</b><span>25 min</span></button>
    <button type="button" class="task glass-row active" data-min="45"><span class="ck"><svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.3 2.3 4.7-4.9"/></svg></span><b>Draft chapter two</b><span>45 min</span></button>
    <button type="button" class="task glass-row" data-min="30"><span class="ck"><svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.3 2.3 4.7-4.9"/></svg></span><b>Read twenty pages</b><span>30 min</span></button>
  </div>
</main>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const card = $("#card"), island = $("#island"), tasks = $$(".task");
  const PAUSE = '<svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.4" height="8" rx=".6"/><rect x="6.1" y="1" width="2.4" height="8" rx=".6"/></svg>';
  const PLAY = '<svg viewBox="0 0 10 10"><path d="M2.5 1.2v7.6L8.8 5z"/></svg>';
  const t = { task: tasks[1], total: 45 * 60, left: 24 * 60 + 15, running: true };
  let state = "compact", idle = 0;

  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  function paint() {
    $$(".t", island).forEach((e) => (e.textContent = fmt(t.left)));
    $$(".nm", island).forEach((e) => (e.textContent = t.task ? t.task.querySelector("b").textContent : ""));
    const frac = t.total ? t.left / t.total : 0;
    $$(".ring .fg", island).forEach((c) => { const L = 2 * Math.PI * c.r.baseVal.value; c.style.strokeDasharray = L; c.style.strokeDashoffset = L * (1 - frac); });
    $(".k .bar i", island).style.width = `${(1 - frac) * 100}%`;
    $(".w .pp", island).innerHTML = t.running ? PAUSE : PLAY;
    $(".pause", island).textContent = t.running ? "Pause" : "Resume";
  }
  function set(s) {
    state = s; island.classList.remove("compact", "wide", "expanded"); island.classList.add(s);
    card.classList.toggle("open", s === "expanded");
    island.setAttribute("aria-expanded", String(s === "expanded"));
    clearTimeout(idle);
    if (s === "expanded") idle = setTimeout(() => set("compact"), 2200);   // a couple of seconds untouched → back to the small bar
  }
  const poke = () => { if (state === "expanded") set("expanded"); };             // any touch inside restarts the idle clock

  setInterval(() => { if (t.running && t.task && t.left > 0) { t.left--; paint(); if (!t.left) { t.running = false; paint(); } } }, 1000);

  // "leaving the page": pointer out of the card, or the tab hidden
  card.addEventListener("pointerleave", () => { if (state === "compact" && t.task) set("wide"); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "compact" && t.task) set("wide"); });
  island.addEventListener("click", (e) => { if (state !== "expanded") { set("expanded"); e.stopPropagation(); } });
  island.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && state !== "expanded") { e.preventDefault(); set("expanded"); } });
  island.addEventListener("pointermove", poke); island.addEventListener("pointerdown", poke);
  $(".pause", island).onclick = (e) => { e.stopPropagation(); t.running = !t.running; paint(); poke(); };
  $(".end", island).onclick = (e) => {
    e.stopPropagation(); t.running = false; t.task?.classList.remove("active"); t.task = null;
    set("compact"); island.classList.add("gone");
  };
  tasks.forEach((b) => b.addEventListener("click", (e) => {
    if (e.target.closest(".ck")) { b.classList.toggle("done"); if (b === t.task && b.classList.contains("done")) $(".end", island).click(); return; }
    if (b.classList.contains("done") || b === t.task) return;
    t.task?.classList.remove("active"); b.classList.add("active");
    t.task = b; t.total = +b.dataset.min * 60; t.left = t.total; t.running = true;
    island.classList.remove("gone"); set("compact"); paint();
  }));
  paint();

  /* ?demo (recording only): leave → tap → idle, then the next task */
  if (/[?&]demo\b/.test(location.search)) {
    const S = [[700, () => set("wide")], [1900, () => set("expanded")], [5000, () => tasks[2].click()], [5700, () => set("wide")], [6900, () => set("expanded")]];
    for (const [ms, fn] of S) setTimeout(fn, ms);
  }
})();
</script>
</body>
</html>
