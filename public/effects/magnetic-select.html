<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic select</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f4f4f5; color: #111; overflow: hidden; -webkit-font-smoothing: antialiased; --ink: #111114; --ink-rgb: 17, 17, 20; --card: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 224px; height: 100%; }
  .stage { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(60% 50% at 30% 70%, #fbe7ee66, transparent 70%), radial-gradient(50% 40% at 75% 30%, #e6ecfb80, transparent 70%); }
  .stage[data-fill="dark"] { background: #0e0f11; --ink: #f4f4f5; --ink-rgb: 244, 244, 245; --card: #1b1c1f; color: #f4f4f5; }
  /* ── the bench: one panel, two kinds of control ── */
  .bench { border-left: 1px solid #00000010; background: #fff; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .bench h2 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; } .bench h2 small { display: block; margin-top: 2px; font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; color: #8a8a90; font-weight: 500; }
  .bench .grp { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: #a0a0a6; margin-top: 6px; }
  .sw { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #444; }
  .sw .seg { display: inline-flex; padding: 3px; border-radius: 99px; background: #f1f1f3; } .sw .seg button { border: 0; background: transparent; font: 500 11px/1 inherit; color: #8a8a90; padding: 6px 10px; border-radius: 99px; cursor: pointer; } .sw .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px #0000001a; }
  .lv { position: relative; height: 34px; border-radius: 9px; background: #f1f1f3; overflow: hidden; }
  .lv i { position: absolute; inset: 0; width: var(--v); background: #dcdcdf; border-radius: 9px 0 0 9px; pointer-events: none; }
  .lv span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #333; pointer-events: none; } .lv b { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lv input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: ew-resize; }
  .credit { margin-top: auto; font-size: 8.5px; line-height: 1.4; color: #a0a0a6; } .credit a { color: inherit; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #00000055; } .stage[data-fill="dark"] .hint { color: #ffffff55; }
  /* a 500px card in the library grid keeps the bench beside the stage, just narrower; only phones stack it */
  @media (max-width: 600px) { .wrap { grid-template-columns: 1fr 172px; } .bench { padding: 12px 10px; gap: 8px; } .sw .seg button { padding: 5px 8px; } .lv { height: 30px; } }
  @media (max-width: 420px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .bench { border-left: 0; border-top: 1px solid #00000010; max-height: 46%; } }


  /* ── Magnetic select ──
     Each chip is two elements: the outer one is driven by springs (position,
     anisotropic scale, tilt); the inner one owns the hover scale in CSS so a
     hover never fights the spring for the same transform. */
  .cluster { position: relative; width: 240px; height: 240px; }
  .chip { position: absolute; left: 50%; top: 50%; width: var(--chip); height: var(--chip); margin: calc(var(--chip) / -2) 0 0 calc(var(--chip) / -2); will-change: transform; }
  .chip .face { width: 100%; height: 100%; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px #0000000a, 0 6px 16px -10px #00000040; cursor: pointer; transition: transform 260ms cubic-bezier(.2,.7,.2,1), background-color 260ms; border: 1px solid transparent; }
  .stage[data-stroke="on"] .chip .face { border-color: rgba(var(--ink-rgb), .14); }
  .chip:hover .face { transform: scale(1.045); background: #ededef; }
  .chip.on .face { background: radial-gradient(60% 60% at 35% 35%, #ff9a5f, #ff3d8a 55%, #b23bff); box-shadow: 0 10px 24px -12px #ff3d8a80; }

</style>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="cluster" id="cluster"></div>
    <div class="hint">Click a chip</div>
  </div>
  <aside class="bench" id="bench"></aside>
</div>
<script>
  /* ── the bench: a tiny control panel, one function ──
     specs: { key, label, type: 'seg' | 'level', opts?, min?, max?, step?, unit?, value }
     onChange(state) runs on every change with the whole state. */
  function bench(root, title, kind, specs, onChange) {
    const state = Object.fromEntries(specs.map((s) => [s.key, s.value]));
    root.innerHTML = `<h2>${title}<small>${kind}</small></h2>`;
    let lastType = '';
    for (const s of specs) {
      if (s.type !== lastType) { root.insertAdjacentHTML('beforeend', `<div class="grp">${s.type === 'seg' ? 'Switches' : 'Levels'}</div>`); lastType = s.type; }
      if (s.type === 'seg') {
        const el = document.createElement('div'); el.className = 'sw';
        el.innerHTML = `<span>${s.label}</span><span class="seg">${s.opts.map((o) => `<button type="button" class="${o === s.value ? 'on' : ''}" data-o="${o}">${o}</button>`).join('')}</span>`;
        el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); state[s.key] = isNaN(+b.dataset.o) ? b.dataset.o : +b.dataset.o; onChange(state, s.key); });
        root.appendChild(el);
      } else {
        const el = document.createElement('label'); el.className = 'lv';
        const pct = (v) => ((v - s.min) / (s.max - s.min) * 100).toFixed(1) + '%';
        el.innerHTML = `<i style="--v:${pct(s.value)}"></i><span>${s.label}</span><b>${s.value}${s.unit || ''}</b><input type="range" min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${s.value}">`;
        el.querySelector('input').addEventListener('input', (e) => { const v = +e.target.value; state[s.key] = v; el.querySelector('i').style.setProperty('--v', pct(v)); el.querySelector('b').textContent = v + (s.unit || ''); onChange(state, s.key); });
        root.appendChild(el);
      }
    }
    root.insertAdjacentHTML('beforeend', `<div class="credit">Rebuilt from <a href="https://bencho.dev" target="_blank" rel="noopener">Bencho</a> by Lorenzo Cabra · block logic MIT © 2026 Lorenzo Cabra</div>`);
    onChange(state, null);
    return state;
  }


  const stage = document.getElementById('stage'), cluster = document.getElementById('cluster');
  let chips = [], sel = 0, P = {};
  /* spring: one scalar chasing a target. stiffness/damping in framer's units. */
  const mkSpring = (v) => ({ v, t: v, vel: 0, k: 260, d: 24, delay: 0, wait: 0 });
  function stepSpring(s, dt) {
    if (s.wait > 0) { s.wait -= dt; return; }
    const f = -s.k * (s.v - s.t) - s.d * s.vel; s.vel += f * dt; s.v += s.vel * dt;
    if (Math.abs(s.vel) < .001 && Math.abs(s.v - s.t) < .001) { s.v = s.t; s.vel = 0; }
  }
  function layout() {
    cluster.innerHTML = ''; chips = [];
    const CHIP = P.size === 'Large' ? 44 : 52, PITCH = CHIP + 14;
    cluster.style.setProperty('--chip', CHIP + 'px');
    // seven = one in the middle and six on a hexagon; three = a row
    const pts = P.size === 'Large' ? [[0, 0], ...Array.from({ length: 6 }, (_, i) => [Math.cos(i * Math.PI / 3) * PITCH, Math.sin(i * Math.PI / 3) * PITCH])] : [[-PITCH, 0], [0, 0], [PITCH, 0]];
    pts.forEach(([x, y], i) => {
      const el = document.createElement('div'); el.className = 'chip'; el.innerHTML = '<div class="face"></div>'; cluster.appendChild(el);
      el.addEventListener('click', () => select(i));
      chips.push({ el, x, y, sx: mkSpring(0), sy: mkSpring(0), scx: mkSpring(1), scy: mkSpring(1), rot: mkSpring(0) });
    });
    P.CHIP = CHIP; P.PITCH = PITCH; sel = Math.min(sel, chips.length - 1); select(sel, true);
  }
  function select(i, quiet) {
    sel = i; chips.forEach((c, k) => c.el.classList.toggle('on', k === i));
    const pull = P.pull / 100, bounce = P.bounce / 100, give = P.give / 100;
    /* ONE decision, and the rest is arithmetic. GROW is the knob; ROOM is half
       the extra width, exactly; AURA is the push beyond what geometry demands. */
    const grow = 1.16 + 0.22 * pull, room = P.CHIP * (grow - 1) / 2, aura = 3 + 9 * pull;
    const k = 200 + 160 * (1 - bounce) + 60, damp = (b) => 2 * Math.sqrt(k * b) * (1 - 0.72 * bounce);   // bounce lowers the damping of every spring
    const s = chips[i];
    chips.forEach((c, j) => {
      const swing = (kk) => ({ k: kk, d: damp(kk / k) * 1 });
      if (j === i) { c.sx.t = 0; c.sy.t = 0; c.scx.t = grow; c.scy.t = grow; c.rot.t = 0; Object.assign(c.sx, swing(k)); Object.assign(c.sy, swing(k)); Object.assign(c.scx, swing(k * 1.24)); Object.assign(c.scy, swing(k * 0.86)); return; }
      /* the shove is a VECTOR: each chip goes the way it lies, and the aura
         decays with real distance — exp(), not 1/d */
      const dx = c.x - s.x, dy = c.y - s.y, gap = Math.hypot(dx, dy), far = gap / P.PITCH;
      const fall = Math.exp(-(far - 1) / 1.8), push = room + aura * fall, tilt = 10 * give;
      c.sx.t = dx / gap * push; c.sy.t = dy / gap * push; c.scx.t = 1; c.scy.t = 1; c.rot.t = dx / gap * tilt * fall;
      /* the far chips are 22ms late per step: a force travelling outward */
      for (const sp of [c.sx, c.sy, c.scx, c.scy, c.rot]) { sp.wait = quiet ? 0 : far * 0.022; }
      Object.assign(c.sx, swing(k)); Object.assign(c.sy, swing(k)); Object.assign(c.scx, swing(k * 1.24)); Object.assign(c.scy, swing(k * 0.86)); Object.assign(c.rot, swing(k));
    });
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const c of chips) { for (const sp of [c.sx, c.sy, c.scx, c.scy, c.rot]) stepSpring(sp, dt);
      c.el.style.transform = `translate(${(c.x + c.sx.v).toFixed(2)}px, ${(c.y + c.sy.v).toFixed(2)}px) rotate(${c.rot.v.toFixed(2)}deg) scale(${c.scx.v.toFixed(3)}, ${c.scy.v.toFixed(3)})`; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  bench(document.getElementById('bench'), 'Magnetic select', 'Select', [
    { key: 'stroke', label: 'Stroke', type: 'seg', opts: ['Off', 'On'], value: 'Off' },
    { key: 'size', label: 'Size', type: 'seg', opts: ['Small', 'Large'], value: 'Large' },
    { key: 'pull', label: 'Pull', type: 'level', min: 0, max: 100, step: 5, value: 55 },
    { key: 'bounce', label: 'Bounce', type: 'level', min: 0, max: 100, step: 5, value: 55 },
    { key: 'give', label: 'Give', type: 'level', min: 0, max: 100, step: 5, value: 50 },
  ], (state, key) => { P = { ...P, ...state }; stage.dataset.stroke = state.stroke.toLowerCase(); if (key === 'size' || key === null) layout(); else select(sel, true); });
  // demo: pick a ring chip once
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => select(2), 1100);

</script>
