<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片抽屉弹出 · Photo Drawer Sheet</title>
<link rel="stylesheet" href="_popup/popup.css">
<style>
  body::before { background-image: url(_popup/bowl.jpg); }
  .screen { --screen: #efebe6; --red: #e3532f; }
  /* host: a recipe app — a two-column grid of dishes; the first card is the one that opens */
  .host { padding: 0 11px; transition: filter .5s var(--out); }
  .open .host { filter: blur(1.5px); }
  .top { display: flex; align-items: center; gap: 9px; margin: 2px 2px 8px; }
  .logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; }
  .logo svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .top div { flex: 1; } .top b { font-size: 13px; font-weight: 800; } .top small { display: block; font-size: 8.5px; color: #8b857c; }
  .top > span:last-child { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; }
  .top > span:last-child svg { width: 12px; height: 12px; fill: none; stroke: #1c1a19; stroke-width: 2; stroke-linecap: round; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .col { display: grid; gap: 8px; align-content: start; }
  .card { position: relative; display: block; width: 100%; border-radius: 14px; overflow: hidden; background: #ccc center / cover; color: #fff; text-align: left; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgb(0 0 0 / .55)); }
  .card em { position: absolute; z-index: 1; left: 6px; top: 6px; display: flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 8px; background: rgb(255 255 255 / .9); color: #1c1a19; font: normal 600 7px var(--ui); }
  .card em::before { content: ""; width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px #1c1a19; }
  .card span { position: absolute; z-index: 1; left: 7px; bottom: 6px; font-size: 8.5px; font-weight: 700; }
  button.card { cursor: pointer; transition: transform .2s; } button.card:active { transform: scale(.97); }
  .card.gone { visibility: hidden; }
  .txt { padding: 14px 10px; border-radius: 14px; background: #f2ddd3; color: #1c1a19; font-size: 13px; font-weight: 800; line-height: 16px; } .txt b { color: var(--red); } .txt small { display: block; margin-top: 6px; font: 600 7.5px var(--ui); color: #8b857c; }
  .dark { padding: 14px 10px; border-radius: 14px; background: #1f1c1b; color: #fff; font-size: 13px; font-weight: 800; line-height: 17px; } .dark b { display: block; color: var(--red); } .dark small { display: block; margin-top: 5px; font: 500 7.5px var(--ui); color: #8b857c; }
  .tabs { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 2; display: flex; justify-content: space-around; align-items: center; height: 46px; border-radius: 23px; background: rgb(255 255 255 / .92); box-shadow: 0 8px 20px -10px rgb(0 0 0 / .3); }
  .tabs i { width: 16px; height: 16px; border-radius: 5px; background: #cfc9c0; } .tabs i.on { width: 34px; height: 34px; border-radius: 50%; background: var(--red); }

  /* beat 1 — the tapped card's photo grows into the panel's top photo (its image settles from 1.08 to 1) */
  .photo { position: absolute; z-index: 11; border-radius: 14px; overflow: hidden; opacity: 0; pointer-events: none; box-shadow: 0 18px 40px -20px rgb(0 0 0 / .55);
    transition: top .5s var(--out), left .5s var(--out), width .5s var(--out), height .5s var(--out), border-radius .5s var(--out); }
  .photo.on { opacity: 1; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform .9s var(--out); }
  .photo.big img { transform: scale(1); }
  .photo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(130% 110% at 25% 70%, transparent 40%, rgb(0 0 0 / .62)); }   /* the dark corner that holds the white title */
  .photo > span { position: absolute; z-index: 1; color: #fff; opacity: 0; transition: opacity .3s .25s; }
  .photo.big > span { opacity: 1; }
  .lbl { left: 13px; top: 11px; font-size: 7.5px; font-weight: 700; letter-spacing: .24em; }
  .tag { right: 11px; top: 9px; padding: 3px 7px; border-radius: 8px; background: rgb(0 0 0 / .35); font-size: 7px; }
  .ttl { left: 13px; bottom: 30px; font-size: 22px; font-weight: 800; font-family: "Songti SC", "Noto Serif SC", serif; line-height: 24px; } .ttl small { display: block; font: 600 6.5px var(--ui); letter-spacing: .22em; opacity: .85; }
  /* beat 2 — the drawer is pushed up from below and overlaps the photo's bottom edge by 22px */
  .drawer { position: absolute; z-index: 12; left: 11px; right: 11px; padding: 14px 15px 13px; border-radius: 20px; background: #e9e5e0; color: #1c1a19; box-shadow: 0 -10px 24px -14px rgb(0 0 0 / .45), 0 20px 40px -20px rgb(0 0 0 / .4);
    transform: translateY(640px); visibility: hidden; transition: transform .3s cubic-bezier(.4, 0, 1, 1), visibility 0s .3s; }
  .open .drawer { transform: none; visibility: visible; transition: transform .6s var(--out) .42s, visibility 0s .42s; }
  .drawer > small { font-size: 8px; color: #8b857c; }
  .num { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; } .num b { font-size: 42px; line-height: 44px; font-weight: 400; letter-spacing: -.02em; } .num small { font-size: 9.5px; }
  .bar { position: relative; height: 3px; margin-top: 8px; border-radius: 2px; background: #d6d0c8; overflow: hidden; }
  .bar i { position: absolute; inset: 0; background: var(--red); transform-origin: left; transform: scaleX(0); }
  .scale { display: flex; justify-content: space-between; margin-top: 5px; font-size: 7px; color: #8b857c; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #dad4cc; }
  .kv small { display: block; font-size: 7px; color: #8b857c; } .kv b { display: block; margin-top: 2px; font-size: 9.5px; font-weight: 600; } .kv b.mono { font: 500 9px var(--mono); }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 13px; }
  .acts button { height: 32px; border-radius: 9px; font-size: 10px; font-weight: 600; transition: transform .15s; } .acts button:active { transform: scale(.97); }
  .acts .a { background: #fff; } .acts .b { background: #1c1a19; color: #fff; }
</style>
</head>
<body>
<div class="phone"><div class="screen" id="screen">
  <div class="notch"></div>
  <div class="host">
    <div class="status"><span>8:47</span><i><svg viewBox="0 0 17 10"><rect x="0" y="6" width="3" height="4" rx="1"/><rect x="4.5" y="4" width="3" height="6" rx="1"/><rect x="9" y="2" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="10" rx="1"/></svg><svg viewBox="0 0 24 10"><rect x=".5" y=".5" width="20" height="9" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="6" rx="1.5"/></svg></i></div>
    <div class="top"><span class="logo"><svg viewBox="0 0 16 16"><path d="M3 7h10a5 5 0 0 1-10 0zM8 7V3"/></svg></span><div><b>拾味 FORAGE</b><small>食谱 · 采买 · 一起做饭</small></div><span><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></span></div>
    <div class="cols">
      <div class="col">
        <button type="button" class="card" id="open" style="height:122px;background-image:url(_popup/bowl.jpg)" aria-label="打开拾味食谱年册"><em>25 分钟</em><span>香煎三文鱼谷物碗</span></button>
        <div class="txt">Learn.<br>Cook.<br><b>Share.</b><small>每天一道，做完打卡</small></div>
        <div class="card" style="height:150px;background-image:url(_popup/pizza.jpg)"><em>90 分钟</em><span>薄底玛格丽特披萨</span></div>
        <div class="card" style="height:110px;background-image:url(_popup/shrimp.jpg)"><em>22 分钟</em><span>鲜虾泰式炒河粉</span></div>
      </div>
      <div class="col">
        <div class="card" style="height:160px;background-image:url(_popup/pancake.jpg)"><em>30 分钟</em><span>厚松饼淋枫糖</span></div>
        <div class="card" style="height:106px;background-image:url(_popup/pasta.jpg)"><em>18 分钟</em><span>罗勒青酱蝴蝶面</span></div>
        <div class="dark">1000+<b>独家食谱</b><small>厨师与家常作者共建</small></div>
        <div class="card" style="height:120px;background-image:url(_popup/greens.jpg)"><em>15 分钟</em><span>菠菜坚果沙拉</span></div>
      </div>
    </div>
    <div class="tabs"><i></i><i></i><i class="on"></i><i></i><i></i></div>
  </div>
  <div class="scrim" id="scrim" style="--scrim: .16"></div>
  <div class="photo" id="photo" aria-hidden="true"><img src="_popup/bowl.jpg" alt=""><span class="lbl">FORAGE</span><span class="tag">● 有效中</span><span class="ttl">拾味<small>RECIPE BOOK</small></span></div>
  <section class="drawer" id="drawer" role="dialog" aria-label="拾味食谱年册">
    <small>剩余天数</small>
    <div class="num"><b class="tnum" id="days">0</b><small>天</small></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="scale"><span>已用 202 天</span><span>共 365 天</span></div>
    <div class="kv"><div><small>有效期至</small><b class="mono">2027.03.10</b></div><div><small>常做</small><b>三文鱼谷物碗</b></div><div><small>开册日期</small><b class="mono">2026.03.10</b></div><div><small>年限</small><b>1 年</b></div></div>
    <div class="acts"><button type="button" class="a" id="next">换一道</button><button type="button" class="b">开始做</button></div>
  </section>
  <div class="homebar"></div>
</div></div>
<script src="_popup/kit.js"></script>
<script>
(() => {
  const { $, tween, count, reduce } = Kit;
  const screen = $("#screen"), card = $("#open"), photo = $("#photo"), drawer = $("#drawer"), bar = $("#bar");
  const LEFT = 163, TOTAL = 365;
  // the panel lives right under the header, as wide as the grid
  const PANEL = { left: 11, width: 266, height: 160, overlap: 22 };
  let stop = [], timers = [], openState = false;
  const clear = () => { stop.forEach((f) => f()); stop = []; timers.forEach(clearTimeout); timers = []; };
  const rectOf = (el) => { const r = el.getBoundingClientRect(), s = screen.getBoundingClientRect(); return { left: r.left - s.left, top: r.top - s.top, width: r.width, height: r.height }; };
  const place = (r, radius) => Object.assign(photo.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: radius + "px" });
  function panelTop() { return rectOf(card).top; }                     // the first card sits at the top of the grid, so the panel starts where it starts
  function open() {
    if (openState) return; openState = true; clear();
    // start exactly on the card…
    photo.style.transition = "none"; place(rectOf(card), 14); photo.classList.add("on"); photo.classList.remove("big"); void photo.offsetWidth; photo.style.transition = "";
    card.classList.add("gone");
    const top = panelTop();
    drawer.style.top = top + PANEL.height - PANEL.overlap + "px";
    $("#days").textContent = "0"; bar.style.transform = "scaleX(0)";
    screen.classList.add("open");
    // …then grow to the panel's photo (beat 1)
    requestAnimationFrame(() => { place({ left: PANEL.left, top, width: PANEL.width, height: PANEL.height }, 20); photo.classList.add("big"); });
    // beat 3: once the drawer has landed (.42 s delay + .6 s), the number and the bar
    stop.push(count($("#days"), 0, LEFT, 900, { delay: reduce() ? 0 : 1050 }));
    stop.push(tween(800, (e) => (bar.style.transform = `scaleX(${(LEFT / TOTAL) * e})`), { delay: reduce() ? 0 : 1250 }));
  }
  function close() {
    if (!openState) return; openState = false; clear();
    screen.classList.remove("open");                                         // the drawer drops first (.3 s, ease-in)…
    timers.push(setTimeout(() => { place(rectOf(card), 14); photo.classList.remove("big"); }, reduce() ? 0 : 160));          // …then the photo shrinks back into its card
    timers.push(setTimeout(() => { photo.classList.remove("on"); card.classList.remove("gone"); }, reduce() ? 0 : 680));
  }
  drawer.style.top = panelTop() + PANEL.height - PANEL.overlap + "px";   // seated from the start, so the closed drawer is fully off-screen
  card.onclick = open; $("#scrim").onclick = close; $("#next").onclick = close;
  addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  Kit.demo([[700, open], [5400, close], [6600, open]]);
})();
</script>
</body>
</html>
