<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass skeleton page switch</title>
<!--
  Glass skeleton page switch — the sequencing behind the spatial-glass dashboard.
  The window never moves. On a tab change:
    0 ms      old content is dropped in one frame (no cross-fade)
    0–455 ms  new cards fade in EMPTY, 65 ms apart, 240 ms each (opacity + 8 px rise)
    280 ms    card contents fade in (280 ms) and every value starts growing (1100 ms)
    ~900 ms   settled — hover lift switches on
  The timeline under the window shows the phases and a playhead; slow-mo stretches every
  duration ×4 through one --slow variable, and «no skeleton» shows what it looks like
  when everything simply appears together.
  Background photo: Josh Davies (@mestra) on Unsplash — Unsplash License.
-->
<style>
  @font-face { font-family: "Inter"; src: url("_fonts/inter-500-latin.woff2") format("woff2"); font-weight: 400 500; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("_fonts/inter-700-latin.woff2") format("woff2"); font-weight: 600 700; font-display: swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; background: #3b322b; font-family: "Inter", -apple-system, sans-serif; color: #1d1a17; -webkit-font-smoothing: antialiased; user-select: none; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .room { position: fixed; inset: -24px; background: url("dashboard-spatial-glass/room.jpg") 68% 38% / max(128vw, 196vh) auto no-repeat; filter: blur(1.5px); }
  .room::after { content: ""; position: absolute; inset: 0; background: radial-gradient(40% 32% at 50% 38%, rgba(40, 30, 22, .5), transparent 70%); }
  .stage { position: absolute; left: 50%; top: 50%; width: 1040px; height: 640px; transform: translate(-50%, -50%) scale(var(--s, 1)); --slow: 1; }
  .glass { background: linear-gradient(180deg, rgba(255, 252, 248, .26), rgba(255, 250, 245, .14)); backdrop-filter: blur(34px) saturate(1.3); -webkit-backdrop-filter: blur(34px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .34); box-shadow: 0 30px 70px rgba(38, 24, 12, .28), inset 0 1px 0 rgba(255, 255, 255, .45); }
  .panel { position: absolute; left: 0; right: 0; top: 0; height: 470px; border-radius: 36px; overflow: hidden; padding: 24px 28px; }
  .dock { position: absolute; left: 50%; translate: -50% 0; top: 446px; height: 46px; border-radius: 23px; display: flex; align-items: center; padding: 0 5px; z-index: 2; }
  .dock button { position: relative; z-index: 1; height: 36px; padding: 0 18px; border-radius: 18px; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .92); transition: color .25s; }
  .dock button.on { color: #1d1a17; }
  .pill { position: absolute; top: 5px; height: 36px; border-radius: 18px; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); transition: left calc(300ms * var(--slow)) cubic-bezier(.22, 1, .36, 1), width calc(300ms * var(--slow)) cubic-bezier(.22, 1, .36, 1); }

  h1 { font-size: 25px; font-weight: 600; letter-spacing: -.02em; opacity: 0; transition: opacity calc(260ms * var(--slow)) ease-out calc(60ms * var(--slow)); }
  .sub0 { font-size: 11.5px; color: rgba(29, 26, 23, .4); margin-top: 5px; opacity: 0; transition: opacity calc(260ms * var(--slow)) ease-out calc(60ms * var(--slow)); }
  .view.in h1, .view.in .sub0 { opacity: 1; }
  .grid { display: grid; gap: 14px; margin-top: 22px; }
  .card { border-radius: 20px; padding: 14px 16px; background: rgba(255, 255, 255, .24); border: 1px solid rgba(255, 255, 255, .42); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 8px 24px rgba(40, 25, 10, .08);
    opacity: 0; transform: translateY(8px) scale(.985);
    transition: opacity calc(240ms * var(--slow)) ease-out, transform calc(380ms * var(--slow)) cubic-bezier(.22, 1, .36, 1);
    transition-delay: calc(var(--i) * 65ms * var(--slow)); }
  .view.in .card { opacity: 1; transform: none; }
  .card > * { opacity: 0; transition: opacity calc(280ms * var(--slow)) ease-out; }
  .view.live .card > * { opacity: 1; transition-delay: calc(var(--i) * 30ms * var(--slow)); }
  .view.settled .card { transition: transform 320ms cubic-bezier(.22, 1, .36, 1); transition-delay: 0s; }
  .view.settled .card:hover { transform: translateY(-5px); }
  /* «no skeleton» — everything at once, for comparison */
  .stage.flat .card, .stage.flat .card > *, .stage.flat h1, .stage.flat .sub0 { transition: none !important; }
  .lbl { font-size: 11px; color: rgba(29, 26, 23, .55); font-weight: 500; }
  .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 10px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 12px; }
  .bars i { flex: 1; height: 0; border-radius: 7px; background: rgba(255, 255, 255, .9); transition: height calc(900ms * var(--slow)) cubic-bezier(.22, 1, .36, 1); transition-delay: calc(var(--k) * 45ms * var(--slow) + 60ms * var(--slow)); }
  .bars i.acc { background: #ef5a2a; }
  .view.live .bars i { height: var(--h); }
  .ring { width: 92px; height: 92px; margin: 10px auto 0; display: block; rotate: -90deg; }
  .ring .v { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset calc(1000ms * var(--slow)) cubic-bezier(.22, 1, .36, 1) calc(80ms * var(--slow)); }
  .view.live .ring .v { stroke-dashoffset: var(--off); }
  .stage.flat .bars i, .stage.flat .ring .v { transition: none !important; }

  /* timeline */
  .tl { position: absolute; left: 0; right: 0; top: 504px; height: 136px; border-radius: 24px; padding: 14px 18px; color: #fff; }
  .tl .row { display: flex; align-items: center; gap: 10px; }
  .tl b { font-size: 12px; }
  .tl .sw { display: inline-flex; padding: 3px; border-radius: 14px; background: rgba(255, 255, 255, .2); }
  .tl .sw button { height: 24px; padding: 0 11px; border-radius: 11px; font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, .9); }
  .tl .sw button.on { background: #fff; color: #1d1a17; }
  .sp { flex: 1; }
  .track { position: relative; height: 76px; margin-top: 10px; }
  .lane { position: absolute; left: 0; right: 0; height: 14px; }
  .seg { position: absolute; top: 0; height: 13px; border-radius: 4px; font-size: 9px; font-weight: 700; line-height: 13px; padding-left: 6px; white-space: nowrap; overflow: hidden; color: #1d1a17; opacity: .45; transition: opacity .2s; }
  .seg.hot { opacity: 1; }
  .ticks { position: absolute; left: 0; right: 0; bottom: -2px; height: 12px; font-size: 9px; color: rgba(255, 255, 255, .75); }
  .ticks span { position: absolute; translate: -50% 0; }
  .head { position: absolute; top: -4px; bottom: 10px; width: 2px; background: #fff; border-radius: 1px; left: 0; opacity: 0; }
</style>
<div class="room" aria-hidden="true"></div>
<div class="stage" id="stage">
  <main class="panel glass"><div class="view" id="view"></div></main>
  <nav class="dock glass" id="dock"><i class="pill" id="pill"></i></nav>
  <section class="tl glass">
    <div class="row"><b>Timeline of one switch</b><span class="sp"></span>
      <span class="sw" id="speed"><button data-s="1" class="on">1×</button><button data-s="4">¼ speed</button></span>
      <span class="sw" id="mode"><button data-m="sk" class="on">Skeleton</button><button data-m="flat">No skeleton</button></span></div>
    <div class="track" id="track">
      <div class="lane" style="top:0"><span class="seg" data-p="sk" style="left:0;width:32.5%;background:#e9e1d8">old page gone in 1 frame → empty cards, 65 ms apart</span></div>
      <div class="lane" style="top:16px"><span class="seg" data-p="live" style="left:20%;width:20%;background:#fbd3c4">contents fade 280 ms</span></div>
      <div class="lane" style="top:32px"><span class="seg" data-p="grow" style="left:20%;width:78.6%;background:#ffb08f">values grow · count 1100 ms ease-out-quart, bars/rings 900–1000 ms</span></div>
      <div class="lane" style="top:48px"><span class="seg" data-p="pill" style="left:0;width:21.4%;background:#fff">dock pill 300 ms</span><span class="seg" data-p="set" style="left:64%;width:36%;background:#cfe9dc">settled → hover lift on</span></div>
      <div class="ticks"></div>
      <i class="head" id="head"></i>
    </div>
  </section>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fit = () => $("stage").style.setProperty("--s", Math.min(1.1, (innerWidth - 20) / 1040, (innerHeight - 20) / 640).toFixed(4));
  addEventListener("resize", fit); fit();

  const SPAN = 1400; // ms shown on the timeline
  document.querySelector(".ticks").innerHTML = [0, 200, 400, 600, 800, 1000, 1200, 1400].map((t) => `<span style="left:${(t / SPAN) * 100}%">${t}</span>`).join("");

  const ease = (p) => 1 - Math.pow(1 - p, 4);
  const PAGES = {
    Overview: { sub: "Balance, wallets and this week at a glance.", cols: "1.2fr 1fr 1fr", cards: [
      ["Total balance", 233041.19, "$", 2], ["Earnings", 806, "$", 0], ["Spending", 645, "$", 0],
      ["Income by month", null, "bars", [42, 58, 50, 71, 64, 88]], ["Savings rate", 26, "ring"], ["Income", 920, "$", 0] ] },
    Savings: { sub: "Every goal moves on its own.", cols: "1fr 1fr 1fr 1fr", cards: [
      ["Total saved", 18527.44, "$", 2], ["Trip to Bali", 64, "ring"], ["Emergency fund", 63, "ring"], ["New car", 26, "ring"],
      ["Monthly contributions", null, "bars", [45, 63, 50, 73, 90, 96]], ["MacBook Pro", 74, "ring"], ["Birthday gift", 80, "ring"] ] },
    Reports: { sub: "Where your money comes from and where it goes.", cols: "1fr 1fr 1fr 1fr", cards: [
      ["Income", 425, "k"], ["Expenses", 314, "k"], ["Net profit", 111, "k"], ["Savings rate", 26.1, "%"],
      ["Income vs expenses", null, "bars", [20, 52, 83, 31, 61, 47, 70, 60]], ["Spent", 72, "ring"] ] },
  };
  const fmt = (v, kind, d, done) => kind === "$" ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d })
    : kind === "k" ? "$" + (done ? Math.round(v) : v.toFixed(1)) + "k" : kind === "%" ? v.toFixed(1) + "%" : Math.round(v) + "%";

  function render(name) {
    const P = PAGES[name];
    return `<h1>${name}</h1><p class="sub0">${P.sub}</p><div class="grid" style="grid-template-columns:${P.cols}">` +
      P.cards.map(([t, v, kind, x], i) => {
        const span = kind === "bars" ? `grid-column:span ${name === "Overview" ? 2 : 3}` : "";
        let body = "";
        if (kind === "bars") body = `<div class="bars">${x.map((h, k) => `<i class="${k === x.length - 1 ? "acc" : ""}" style="--h:${h}%;--k:${k}"></i>`).join("")}</div>`;
        else if (kind === "ring") body = `<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3.4"/><circle class="v" cx="18" cy="18" r="15.9155" fill="none" stroke="#ef5a2a" stroke-width="3.4" stroke-linecap="round" pathLength="100" style="--off:${100 - v}"/></svg><div class="big" style="text-align:center;font-size:17px;margin-top:6px"><span class="n" data-to="${v}" data-kind="pct">0%</span></div>`;
        else body = `<div class="big"><span class="n" data-to="${v}" data-kind="${kind}" data-d="${x || 0}">${fmt(0, kind, x || 0)}</span></div>`;
        return `<section class="card" style="--i:${i};${span}"><span class="lbl">${t}</span>${body}</section>`;
      }).join("") + "</div>";
  }

  // dock
  const names = Object.keys(PAGES);
  $("dock").insertAdjacentHTML("beforeend", names.map((n) => `<button data-go="${n}">${n}</button>`).join(""));
  const slow = () => +getComputedStyle($("stage")).getPropertyValue("--slow");
  const flat = () => $("stage").classList.contains("flat");

  let token = 0, raf = 0, cur = "";
  function go(name) {
    if (name === cur) return;
    cur = name;
    const my = ++token, k = slow(), t0 = performance.now();
    document.querySelectorAll("#dock button").forEach((b) => b.classList.toggle("on", b.dataset.go === name));
    const b = document.querySelector(`#dock [data-go="${name}"]`);
    $("pill").style.left = b.offsetLeft + "px"; $("pill").style.width = b.offsetWidth + "px";
    const v = $("view");
    v.className = "view"; v.innerHTML = render(name);
    const nums = [...v.querySelectorAll(".n")];
    if (reduce || flat()) {
      v.classList.add("in", "live", "settled");
      nums.forEach((n) => (n.textContent = n.dataset.kind === "pct" ? n.dataset.to + "%" : fmt(+n.dataset.to, n.dataset.kind, +n.dataset.d, true)));
      return;
    }
    v.offsetWidth;
    requestAnimationFrame(() => { if (my === token) v.classList.add("in"); });
    setTimeout(() => { if (my === token) v.classList.add("live"); }, 280 * k);
    setTimeout(() => { if (my === token) v.classList.add("settled"); }, 900 * k);
    cancelAnimationFrame(raf);
    const head = $("head"); head.style.opacity = 1;
    const segs = [...document.querySelectorAll(".seg")];
    const win = { drop: [0, 30], sk: [0, 455], live: [280, 560], grow: [280, 1380], pill: [0, 300], set: [900, 1400] };
    const frame = (now) => {
      if (my !== token) return;
      const t = (now - t0) / k; // real ms → timeline ms
      head.style.left = Math.min(100, (t / SPAN) * 100) + "%";
      segs.forEach((s) => { const [a, z] = win[s.dataset.p]; s.classList.toggle("hot", t >= a && t <= z); });
      nums.forEach((n) => {
        const card = n.closest(".card"), i = +card.style.getPropertyValue("--i");
        const p = Math.max(0, Math.min(1, (t - 280 - i * 30) / 1100));
        const to = +n.dataset.to;
        n.textContent = n.dataset.kind === "pct" ? Math.round(to * ease(p)) + "%" : fmt(to * ease(p), n.dataset.kind, +n.dataset.d, p === 1);
      });
      if (t < SPAN) raf = requestAnimationFrame(frame);
      else { head.style.opacity = 0; segs.forEach((s) => s.classList.remove("hot")); }
    };
    raf = requestAnimationFrame(frame);
  }

  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
    const s = e.target.closest("[data-s]");
    if (s) { $("stage").style.setProperty("--slow", s.dataset.s); document.querySelectorAll("#speed button").forEach((x) => x.classList.toggle("on", x === s)); replay(); }
    const m = e.target.closest("[data-m]");
    if (m) { $("stage").classList.toggle("flat", m.dataset.m === "flat"); document.querySelectorAll("#mode button").forEach((x) => x.classList.toggle("on", x === m)); replay(); }
  });
  const replay = () => { const c = cur; cur = ""; go(c); };

  // auto-demo through the three tabs until a real input
  let demo = !reduce, di = 1, demoT = 0;
  const step = () => { if (!demo) return; go(names[di++ % names.length]); demoT = setTimeout(step, 2400 * slow()); };
  addEventListener("pointerdown", (e) => { if (e.isTrusted) { demo = false; clearTimeout(demoT); } }, true);
  go("Overview");
  const pin = () => { const b = document.querySelector('#dock [data-go="Overview"]'); $("pill").style.transition = "none"; $("pill").style.left = b.offsetLeft + "px"; $("pill").style.width = b.offsetWidth + "px"; $("pill").offsetWidth; $("pill").style.transition = ""; };
  pin(); document.fonts && document.fonts.ready.then(() => { const b = document.querySelector("#dock button.on"); $("pill").style.left = b.offsetLeft + "px"; $("pill").style.width = b.offsetWidth + "px"; });
  if (demo) demoT = setTimeout(step, 2000);
})();
</script>
</html>
