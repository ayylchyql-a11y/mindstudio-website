<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target chase · 双针目标仪表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0a0a0c; display: grid; place-items: center; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4f4f6;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }

  /* Laid out at a fixed 470 × 470 and scaled to fit, so every number below is in card pixels. */
  .fit { width: calc(470px * var(--k, 1)); height: calc(470px * var(--k, 1)); }
  .card { position: relative; width: 470px; height: 470px; transform: scale(var(--k, 1)); transform-origin: 0 0;
    border-radius: 28px; background: linear-gradient(135deg, #131419, #0f1014 70%); border: 1px solid #ffffff0d; overflow: hidden; }

  .kicker { position: absolute; left: 32px; top: 29px; display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; letter-spacing: .125em; text-transform: uppercase; color: #ab9cf6; }
  .kicker i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .live { position: absolute; right: 34px; top: 30px; font-size: 11.5px; letter-spacing: .16em; color: #6c6c70; }
  .num { position: absolute; left: 32px; top: 71px; display: flex; align-items: baseline; gap: 13px; }
  .num b { font-size: 54px; font-weight: 300; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
  .num span { position: relative; top: -3px; font-size: 12.5px; color: #a9a9ae; }
  .tag { position: absolute; right: 34px; top: 87px; font-size: 12.5px; letter-spacing: .03em; color: #ab9cf6; }

  svg.gauge { position: absolute; left: 0; top: 0; width: 470px; height: 470px; cursor: pointer; }
  .tick { stroke: #3a3c3b; stroke-width: 2; }
  .tick.on { stroke: #a99ef0; }
  .lbl { position: absolute; font-size: 12px; color: #c3c3c8; transform: translateX(-50%); }

  .rule { position: absolute; left: 34px; right: 34px; top: 390px; height: 1px; background: #ffffff14; }
  .foot { position: absolute; left: 34px; right: 34px; top: 409px; display: flex; justify-content: space-between; font-size: 13px; color: #b3b3b8; }
  .foot span:last-child { font-size: 11.5px; letter-spacing: .03em; color: #a5a5aa; }
</style>
</head>
<body>
<div class="fit">
  <div class="card" id="card">
    <div class="kicker"><i></i>04 / Target chase</div>
    <div class="live">LIVE LOOP</div>
    <div class="num"><b id="val">0%</b><span>efficiency</span></div>
    <div class="tag" id="tag">TARGET 86%</div>

    <svg class="gauge" id="gauge" viewBox="0 0 470 470" role="button" aria-label="Pick a new target">
      <path id="band" fill="none" stroke="#242922" stroke-width="21"/>
      <g id="ticks"></g>
      <path id="prog" fill="none" stroke="#a596ee" stroke-width="4.2" stroke-linecap="round"/>
      <g id="target"><line id="tl" stroke="#f1e8d0" stroke-width="2.6" stroke-linecap="round"/><circle id="td" r="4.6" fill="#f1e8d0"/></g>
      <polygon id="needle" fill="#bca8fa"/>
      <circle cx="235" cy="319" r="9.6" fill="#0f1015" stroke="#bca8fa" stroke-width="2.6"/>
    </svg>
    <span class="lbl" style="left:93px;top:349px">0</span>
    <span class="lbl" style="left:355px;top:349px">100</span>
    <span class="lbl" style="left:235px;top:368px;letter-spacing:.08em">ACTUAL / TARGET</span>

    <div class="rule"></div>
    <div class="foot"><span id="status">Actual follows the target</span><span>TAP TO RETARGET ↗</span></div>
  </div>
</div>
<script>
(() => {
  const CX = 235, CY = 319;
  const R_BAND = 130.5, R_PROG = 130, R_TICK = 141;
  // The loop (seconds), read off the reference: the actual needle falls back to 0;
  // the target marker resets and sweeps up to the target; the actual needle chases it; hold.
  const DROP = 1.35, T_AT = 1.32, T_DUR = 1.3, T_SHOW = 1.5, A_AT = 2.25, A_DUR = 2.58, CYCLE = 7.53;
  const IDLE = 4000;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const sine = (x) => (1 - Math.cos(Math.PI * clamp(x))) / 2;
  const inOutQuad = (x) => (x = clamp(x), x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
  const outQuad = (x) => (x = clamp(x), 1 - (1 - x) * (1 - x));

  // value 0–100 → point on a circle of radius r (0 = left end, 100 = right end, through the top)
  const P = (v, r) => { const a = Math.PI * (1 - v / 100); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
  const arc = (r, v0, v1) => { const [x0, y0] = P(v0, r), [x1, y1] = P(v1, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  $("band").setAttribute("d", arc(R_BAND, 0, 100));

  // 31 ticks, 6° apart; every fifth is long. A tick lights once the actual needle has passed it.
  const ticks = [];
  for (let i = 0; i <= 30; i++) {
    const v = i * 100 / 30, long = i % 5 === 0;
    const [x0, y0] = P(v, R_TICK + (long ? 0 : 2)), [x1, y1] = P(v, R_TICK + (long ? 12 : 8));
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("class", "tick"); l.setAttribute("x1", x0); l.setAttribute("y1", y0); l.setAttribute("x2", x1); l.setAttribute("y2", y1);
    $("ticks").appendChild(l); ticks.push([v, l]);
  }

  const prog = $("prog"), needle = $("needle"), tl = $("tl"), td = $("td"), val = $("val"), tag = $("tag"), status = $("status");
  function draw(actual, target, goal) {
    prog.setAttribute("d", actual > 0.2 ? arc(R_PROG, 0, actual) : "");
    ticks.forEach(([v, l]) => l.classList.toggle("on", actual > 0.2 && v <= actual + 0.01));
    // needle: a thin wedge from the hub to r = 115
    const a = Math.PI * (1 - actual / 100), ux = Math.cos(a), uy = -Math.sin(a), nx = -uy, ny = ux;
    needle.setAttribute("points", [[CX + 115 * ux - .6 * nx, CY + 115 * uy - .6 * ny], [CX + 115 * ux + .6 * nx, CY + 115 * uy + .6 * ny],
      [CX + 8 * ux + 3.6 * nx, CY + 8 * uy + 3.6 * ny], [CX + 8 * ux - 3.6 * nx, CY + 8 * uy - 3.6 * ny]].map((p) => p.map((n) => n.toFixed(2)).join(",")).join(" "));
    const [x0, y0] = P(target, 100), [x1, y1] = P(target, 133.5), [dx, dy] = P(target, 135.5);
    tl.setAttribute("x1", x0); tl.setAttribute("y1", y0); tl.setAttribute("x2", x1); tl.setAttribute("y2", y1);
    td.setAttribute("cx", dx); td.setAttribute("cy", dy);
    const t = Math.round(actual) + "%";
    if (val.textContent !== t) val.textContent = t;
    const g = "TARGET " + goal + "%";
    if (tag.textContent !== g) tag.textContent = g;
    const s = actual >= goal - 1 ? "Target met · holding steady" : "Actual follows the target";
    if (status.textContent !== s) status.textContent = s;
  }

  let goal = 86, t0 = null, manual = null, cur = { actual: goal, target: goal };
  const loopAt = (tau) => ({
    actual: tau < DROP ? goal * (1 - sine(tau / DROP)) : tau < A_AT ? 0 : goal * outQuad((tau - A_AT) / A_DUR),
    target: tau < T_SHOW ? goal : goal * inOutQuad((tau - T_AT) / T_DUR),
  });

  function frame(now) {
    if (t0 === null) t0 = now - (A_AT + A_DUR) * 1000;     // open on the settled gauge, then the loop drops it
    if (manual) {
      const k = (now - manual.at) / 1000;
      cur = { target: manual.t0 + (goal - manual.t0) * inOutQuad(k / 0.9),
              actual: manual.a0 + (goal - manual.a0) * outQuad((k - 0.35) / 1.9) };
      if (k * 1000 > IDLE + 2250) { manual = null; t0 = now; }   // then the loop carries on with the new target
    } else {
      let tau = (now - t0) / 1000;
      if (tau >= CYCLE) { t0 += CYCLE * 1000; tau -= CYCLE; }
      cur = loopAt(tau);
    }
    draw(cur.actual, cur.target, goal);
    requestAnimationFrame(frame);
  }

  // TAP TO RETARGET: a new goal; the marker moves first, the needle follows from wherever it is.
  $("gauge").addEventListener("click", () => {
    let g; do g = 40 + Math.round(Math.random() * 56); while (Math.abs(g - goal) < 12);
    goal = g;
    if (reduce) return draw(goal, goal, goal);
    manual = { at: performance.now(), t0: cur.target, a0: cur.actual };
  });

  if (reduce) draw(goal, goal, goal);
  else requestAnimationFrame(frame);

  const fit = () => document.documentElement.style.setProperty("--k", Math.min(1, (innerWidth - 24) / 470, (innerHeight - 24) / 470));
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
