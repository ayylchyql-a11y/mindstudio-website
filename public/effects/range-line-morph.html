<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range line morph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; background: #0b0b0d; color: #f2f2f2; overflow: hidden; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .win { width: min(560px, calc(100% - 32px)); border-radius: 16px; background: #141416; border: 1px solid #ffffff14; box-shadow: 0 30px 60px -30px #000; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ffffff10; font-size: 11px; }
  .bar b { font-weight: 600; } .bar span { color: #8a8a90; }
  .dots { margin-left: auto; display: flex; gap: 5px; } .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .panel { margin: 12px; padding: 14px 16px; border-radius: 10px; background: #0e0e10; background-image: linear-gradient(#ffffff07 1px, transparent 1px), linear-gradient(90deg, #ffffff07 1px, transparent 1px); background-size: 24px 24px; }
  .label { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #6f6f76; }

  .head { display: flex; justify-content: space-between; align-items: start; margin-top: 8px; }
  .kpi b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; padding: 3px; border-radius: 99px; background: #ffffff12; }
  .seg button { border: 0; background: transparent; color: #8a8a90; font: 600 9px/1 inherit; letter-spacing: .12em; padding: 6px 10px; border-radius: 99px; cursor: pointer; transition: color 200ms, background-color 200ms; }
  .seg button.on { background: #fff; color: #111; }
  svg { display: block; width: 100%; height: 150px; margin-top: 8px; overflow: visible; }
  .x { display: flex; justify-content: space-between; margin-top: 6px; font-size: 8px; letter-spacing: .12em; color: #6f6f76; text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
</style>
<div class="win">
  <div class="bar"><b>Insights</b><span>Steps</span><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div></div>
  <div class="panel">
    <div class="label">Range line</div>
    <div class="head">
      <div class="kpi"><span class="label">Daily steps</span><b id="kpi">7.9K</b></div>
      <div class="seg" role="group"><button data-r="w" type="button">1W</button><button data-r="m" class="on" type="button">1M</button><button data-r="y" type="button">1Y</button></div>
    </div>
    <svg viewBox="0 0 500 150" preserveAspectRatio="none" aria-label="Steps over the selected range">
      <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48ad6" stop-opacity=".45"/><stop offset="1" stop-color="#b48ad6" stop-opacity="0"/></linearGradient></defs>
      <path id="area" fill="url(#fill)"/>
      <path id="line" fill="none" stroke="#c9a6e6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle id="dot" r="4" fill="#fff" stroke="#0e0e10" stroke-width="2"/>
    </svg>
    <div class="x" id="x"></div>
  </div>
</div>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Every range is resampled to the SAME number of points. That is the whole
  // trick: with equal point counts the path morphs — each vertex slides to its
  // new y — instead of being torn down and redrawn.
  const N = 24, W = 500, H = 150, PAD = 8;
  let seed = 11; const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
  const series = (base, amp, trend) => Array.from({ length: N }, (_, i) => base + trend * i / N + Math.sin(i * .9) * amp + (rnd() - .5) * amp * .6);
  const DATA = {
    w: { v: series(7.4, 1.4, 1.2), kpi: 8.2, x: ['Mon', 'Wed', 'Fri', 'Sun'] },
    m: { v: series(7.2, 1.1, 0.9), kpi: 7.9, x: ['1', '10', '20', '30'] },
    y: { v: series(6.0, 0.8, 2.8), kpi: 8.8, x: ['Jan', 'Apr', 'Jul', 'Oct'] },
  };
  const line = document.getElementById('line'), area = document.getElementById('area'), dot = document.getElementById('dot'), kpi = document.getElementById('kpi'), xs = document.getElementById('x');
  const LO = 4, HI = 11;
  const px = (i) => PAD + i * (W - 2 * PAD) / (N - 1), py = (v) => H - PAD - (v - LO) / (HI - LO) * (H - 2 * PAD);
  // Catmull-Rom → cubic beziers, so a straight polyline reads as a curve
  const toPath = (v) => {
    const p = v.map((y, i) => [px(i), py(y)]);
    let d = `M${p[0][0]} ${p[0][1]}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    return d;
  };
  let cur = DATA.m.v.slice(), curKpi = DATA.m.kpi, anim = 0;
  const paint = (v, k) => {
    const d = toPath(v);
    line.setAttribute('d', d);
    area.setAttribute('d', `${d} L${px(N - 1)} ${H} L${px(0)} ${H} Z`);
    dot.setAttribute('cx', px(N - 1)); dot.setAttribute('cy', py(v[N - 1]));
    kpi.textContent = k.toFixed(1) + 'K';
  };
  function go(r) {
    const to = DATA[r];
    xs.innerHTML = to.x.map((t) => `<span>${t}</span>`).join('');
    cancelAnimationFrame(anim);
    if (reduce) { cur = to.v.slice(); curKpi = to.kpi; return paint(cur, curKpi); }
    const from = cur.slice(), fromK = curKpi, DUR = 650, t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / DUR), e = 1 - Math.pow(1 - t, 3);
      cur = from.map((a, i) => a + (to.v[i] - a) * e); curKpi = fromK + (to.kpi - fromK) * e;
      paint(cur, curKpi);
      if (t < 1) anim = requestAnimationFrame(tick);
    };
    anim = requestAnimationFrame(tick);
  }
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b)); go(b.dataset.r);
  }));
  paint(cur, curKpi); xs.innerHTML = DATA.m.x.map((t) => `<span>${t}</span>`).join('');
  // show the morph once without a click
  setTimeout(() => document.querySelector('[data-r=y]').click(), 1100);
</script>
