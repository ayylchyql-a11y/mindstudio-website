<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal bloom hero · CHRYSANT</title>
<style>
  @font-face { font-family: "Italiana"; font-display: swap; src: url(_fonts/italiana-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 700; font-display: swap; src: url(_fonts/syncopate-700-latin.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: swap; src: url(_fonts/poppins-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 500; font-display: swap; src: url(_fonts/poppins-500-latin.woff2) format("woff2"); }

  :root {
    --u: 1px;                                   /* the reference's unit: every offset is calc(var(--u) * n) */
    --ease: cubic-bezier(.22, 1, .36, 1);
    --ink: #eef3fb; --ink-2: rgb(226 234 246 / .72); --ink-3: rgb(226 234 246 / .5);
    --glass: rgb(160 184 220 / .14); --edge: rgb(220 232 250 / .2);
    --serif: "Italiana", "Didot", serif; --sans: "Poppins", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; overflow: hidden; background: #27364f; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, a { font: inherit; color: inherit; }

  /* the page is drawn on a 1220 × 690 board and scaled to fit, so every number below is the reference's own */
  .fit { width: calc(1220px * var(--s, 1)); height: calc(690px * var(--s, 1)); }
  .frame {
    position: relative; width: 1220px; height: 690px; overflow: hidden; border-radius: 22px;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
    box-shadow: inset 0 0 0 1px rgb(220 232 250 / .1), 0 30px 80px -30px rgb(5 10 25 / .7);
    background: #34476a;
  }
  #gl { position: absolute; inset: 0; width: 1220px; height: 690px; display: block; }

  /* ---------- reveal timeline: one @keyframes, 14 elements staggered by --d ---------- */
  .reveal { opacity: 0; transform: translateY(calc(var(--u) * 18)); filter: blur(6px); }
  .is-playing .reveal { animation: reveal 1.1s var(--ease) var(--d, 0s) forwards; }
  @keyframes reveal { to { opacity: 1; transform: none; filter: none; } }
  /* once it has landed, drop the animation: a filled-forwards filter keeps the element a backdrop root,
     and the frosted / liquid glass inside it would have nothing behind it to bend */
  .is-playing .reveal.done { animation: none; opacity: 1; transform: none; filter: none; }

  .glass { background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); -webkit-backdrop-filter: blur(14px) saturate(1.15); backdrop-filter: blur(14px) saturate(1.15); }

  /* header */
  .logo { position: absolute; left: 34px; top: 38px; font: 700 10.5px/1 "Syncopate", var(--sans); letter-spacing: .14em; }
  .nav { position: absolute; left: 382px; top: 23px; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 14px 0 6px; border-radius: 22px; }
  .nav a { height: 32px; padding: 0 17px; display: grid; place-items: center; border-radius: 16px; font-size: 11.5px; color: var(--ink-2); text-decoration: none; transition: color .2s, background-color .2s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current] { color: var(--ink); background: rgb(150 175 215 / .2); box-shadow: inset 0 0 0 1px rgb(220 232 250 / .22); }
  .nav .find { width: 30px; padding: 0; }
  .nav svg, .grid-btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .grid-btn { position: absolute; right: 36px; top: 23px; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .grid-btn i, .dots i { display: grid; grid-template-columns: repeat(3, 3px); gap: 2.5px; }
  .grid-btn i b, .dots i b { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }

  /* title */
  h1 { position: absolute; left: 34px; top: 120px; margin: 0; font: 400 86px/78px var(--serif); letter-spacing: .01em; pointer-events: none; }
  h1 span { display: block; }
  h1 .l1 { margin-left: 36px; }

  /* stepper */
  .steps { position: absolute; left: 34px; top: 333px; width: 300px; margin: 0; padding: 0; list-style: none; }
  .step { position: relative; display: grid; grid-template-columns: 67px 1fr; transition: opacity .4s; }
  .step .num { grid-row: 1 / span 2; align-self: start; height: 28px; padding: 0; border: 0; background: none; text-align: left; font: 400 21px/28px var(--serif); color: var(--ink-2); cursor: pointer; transition: color .3s; }
  .step.active .num { color: var(--ink); }
  .step:not(.active) .num:hover { color: var(--ink); }
  .step > * { transition: opacity .4s; }
  .step.faint > * { opacity: .3; }   /* on the children: the reveal animation owns the li's own opacity */
  /* the thread under the active number */
  .step::before { content: ""; position: absolute; left: 10px; top: 40px; bottom: 14px; width: 1px; background: linear-gradient(rgb(226 234 246 / .45), rgb(226 234 246 / .12)); transform: scaleY(0); transform-origin: top; transition: transform .5s var(--ease); }
  .step.active::before { transform: scaleY(1); }
  .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .step.active .body { grid-template-rows: 1fr; }
  .body > div { min-height: 0; overflow: hidden; }
  .step { padding-bottom: 27px; }   /* outside the collapsing body, so a closed row keeps the reference's 55 px pitch */
  .body h3 { margin: 0; height: 28px; font: 400 13px/28px var(--sans); }
  .body p { width: 215px; margin: 18px 0 28px; font-size: 11px; line-height: 18px; color: var(--ink-2); }
  .pill { display: inline-grid; place-items: center; height: 33px; padding: 0 18px; border-radius: 17px; background: #fff; color: #1f2a3d; font-size: 11px; font-weight: 500; text-decoration: none; transition: background-color .2s, transform .15s; }
  .pill:active { transform: scale(.97); }
  /* switching species: the old copy blurs out, the new copy blurs in one line after another */
  .body h3, .body p, .body .pill { opacity: 0; filter: blur(6px); transform: translateY(6px); transition: opacity .3s, filter .3s, transform .3s; }
  .step.active .body h3, .step.active .body p, .step.active .body .pill { opacity: 1; filter: none; transform: none; transition: opacity .45s var(--ease), filter .45s var(--ease), transform .45s var(--ease); }
  .step.active .body h3 { transition-delay: .08s; } .step.active .body p { transition-delay: .16s; } .step.active .body .pill { transition-delay: .24s; }

  /* stat tiles */
  .stat { position: absolute; left: 1026px; width: 107px; height: 102px; padding: 24px 0 0 15px; border-radius: 16px; }
  .stat.a { top: 130px; } .stat.b { top: 248px; }
  .stat .v { position: relative; display: inline-block; font: 400 25px/1 var(--serif); font-variant-numeric: lining-nums; }
  .stat .v sup { position: absolute; left: 100%; top: -10px; margin-left: 3px; font: 400 7.5px/1 var(--sans); color: var(--ink-3); }
  .stat small { display: block; margin-top: 12px; font-size: 8.5px; color: var(--ink-2); }

  /* scroll badge: a ring of text turning slowly around an arrow */
  .badge { position: absolute; left: 255px; top: 541px; width: 192px; height: 192px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(220 232 250 / .14); }
  .badge .ring { position: absolute; inset: 30px; animation: turn 24s linear infinite; }
  .badge .ring svg { width: 100%; height: 100%; overflow: visible; }
  .badge text { font: 500 8.6px var(--sans); fill: rgb(226 234 246 / .62); }
  .badge .core { position: absolute; inset: 66px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(220 232 250 / .16); }
  .badge .core svg { width: 11px; height: 11px; fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes turn { to { transform: rotate(1turn); } }

  /* cards */
  .card { position: absolute; border-radius: 20px; overflow: hidden; }
  .crafted { left: 670px; top: 414px; width: 261px; height: 254px; padding: 18px; }
  .crafted .liquid { position: absolute; inset: 0; border-radius: inherit; -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); background: rgb(170 192 225 / .1); }
  .liquid-ok .crafted .liquid { -webkit-backdrop-filter: url(#liquid-glass); backdrop-filter: url(#liquid-glass); background: rgb(170 192 225 / .06); }
  .crafted::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgb(225 236 252 / .26), inset 0 1px 0 rgb(255 255 255 / .18); }
  .crafted > :not(.liquid) { position: relative; }
  .crafted .mark { width: 56px; height: 56px; fill: none; stroke: rgb(240 245 252 / .85); stroke-width: .9; }
  .crafted .dots { position: absolute; right: 18px; top: 20px; color: rgb(240 245 252 / .7); }
  .crafted h2 { margin: 72px 0 12px; font: 400 21px/21px var(--serif); letter-spacing: .02em; }
  .crafted p { margin: 0; font-size: 9.6px; line-height: 15.5px; color: var(--ink-2); }
  .photo { display: block; background: center / cover no-repeat; box-shadow: inset 0 0 0 1px rgb(225 236 252 / .2), 0 20px 40px -24px rgb(8 15 30 / .8); transition: box-shadow .35s, translate .35s var(--ease); cursor: pointer; }
  .photo.p1 { left: 945px; top: 424px; width: 179px; height: 244px; background-color: #8b9bb5; }
  .photo.p2 { left: 1137px; top: 440px; width: 179px; height: 228px; background-color: #446d93; }
  /* lit: the card previews the species that is currently selected */
  .photo.lit { box-shadow: inset 0 0 0 1.5px rgb(240 246 255 / .75), 0 0 0 4px rgb(200 220 250 / .12), 0 24px 44px -22px rgb(8 15 30 / .9); translate: 0 -4px; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; filter: none; }
    .is-playing .reveal { animation: none; }
    .badge .ring { animation: none; }
    .body h3, .body p, .body .pill, .step::before, .body { transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="fit" id="fit"><div class="frame" id="frame">
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="logo reveal" style="--d:1.6s">CHRYSANT</div>
  <nav class="nav glass reveal" style="--d:1.8s" aria-label="Main">
    <a href="#home" aria-current="page">Home</a><a href="#collection">Collection</a><a href="#species">Species</a><a href="#journal">Journal</a><a href="#gallery">Gallery</a>
    <a class="find" href="#search" aria-label="Search"><svg viewBox="0 0 12 12"><circle cx="5.2" cy="5.2" r="3.7"/><path d="M8 8l2.6 2.6"/></svg></a>
  </nav>
  <button class="grid-btn glass reveal" style="--d:2s" type="button" aria-label="Menu"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></button>

  <h1 aria-label="Crystal Lotus"><span class="l1 reveal" style="--d:.9s">CRYSTAL</span><span class="l2 reveal" style="--d:1.05s">LOTUS</span></h1>

  <ol class="steps" id="steps"></ol>

  <div class="stat a glass reveal" style="--d:2.1s"><span class="v" data-stat="lux"><span>164</span><sup>lux</sup></span><small>Light Exposure</small></div>
  <div class="stat b glass reveal" style="--d:2.25s"><span class="v" data-stat="cm"><span>84</span><sup>cm</sup></span><small>Average Height</small></div>

  <div class="badge reveal" style="--d:2.2s" aria-hidden="true">
    <div class="ring"><svg viewBox="0 0 132 132"><defs><path id="circ" d="M66 66m-56 0a56 56 0 1 1 112 0a56 56 0 1 1-112 0"/></defs><text><textPath href="#circ" textLength="348" lengthAdjust="spacing">SCROLL DOWN · SCROLL DOWN · </textPath></text></svg></div>
    <div class="core"><svg viewBox="0 0 12 12"><path d="M6 1.5v9M2.8 7.3L6 10.5l3.2-3.2"/></svg></div>
  </div>

  <article class="card crafted reveal" style="--d:2.4s">
    <div class="liquid"></div>
    <svg class="mark" viewBox="0 0 56 56" aria-hidden="true" id="mark"></svg>
    <span class="dots" aria-hidden="true"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></span>
    <h2>CRAFTED IN<br>CRYSTAL</h2>
    <p>A flower revered across cultures, the chrysanthemum represents longevity, optimism, and resilience.</p>
  </article>
  <a class="card photo p1 reveal" style="--d:2.55s" href="#crystal-lotus" data-href="#crystal-lotus" aria-label="Crystal Lotus"></a>
  <a class="card photo p2 reveal" style="--d:2.7s" href="#prism-star" data-href="#prism-star" aria-label="Prism Star"></a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="soft"/>
      <feImage id="map-img" x="0" y="0" width="261" height="254" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="soft" in2="map" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</div></div>

<script type="module">
import { createFlower, studio, keyLight, SPECIES, T } from "./_crystal/flower.js";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const frame = document.getElementById("frame"), fit = document.getElementById("fit");

/* ---------- fit the 1220 × 690 board to the window ---------- */
let scale = 1;
function resize() {
  scale = Math.min(innerWidth / 1220, innerHeight / 690);
  fit.style.setProperty("--s", scale); frame.style.setProperty("--s", scale);
  sizeGL();
}

/* ---------- species & stepper ---------- */
const species = [
  { id: "frost-dahlia", name: "Frost Dahlia", desc: "A graceful aquatic flower known for its perfect symmetry and calming presence.", lux: 164, cm: 84 },
  { id: "crystal-lotus", name: "Crystal Lotus", desc: "Soft translucent petals that bend light like still water at dawn.", lux: 128, cm: 66 },
  { id: "prism-star", name: "Prism Star", desc: "Six faceted petals around a gilded heart, cut to scatter rainbows.", lux: 210, cm: 12 },
];
const delays = [1.3, 1.45, 1.55];
const list = document.getElementById("steps");
list.innerHTML = species.map((s, i) => `
  <li class="step reveal${i === 0 ? " active" : ""}${i > 1 ? " faint" : ""}" style="--d:${delays[i]}s" id="${s.id}">
    <button class="num" type="button" aria-label="${s.name}" aria-pressed="${i === 0}">0${i + 1}</button>
    <div class="body"><div><h3>${s.name}</h3><p>${s.desc}</p><a class="pill" href="#${s.id}">Know more</a></div></div>
  </li>`).join("");
const steps = [...list.children];
const stats = [...document.querySelectorAll("[data-stat]")];
const cards = [...document.querySelectorAll(".photo")];
let current = 0;

function select(i) {
  if (i === current) return;
  current = i;
  steps.forEach((s, j) => {
    s.classList.toggle("active", j === i);
    s.classList.toggle("faint", Math.abs(j - i) > 1);
    s.querySelector(".num").setAttribute("aria-pressed", String(j === i));
    s.querySelectorAll(".pill").forEach(a => a.tabIndex = j === i ? 0 : -1);
  });
  const s = species[i];
  stats.forEach(b => countTo(b, s[b.dataset.stat]));
  // the photo cards double as previews for species 02 and 03
  cards.forEach(c => c.classList.toggle("lit", c.dataset.href.endsWith("#" + s.id)));
}
function countTo(el, to) {
  const text = el.firstElementChild.firstChild;
  const from = parseFloat(text.nodeValue) || 0;
  if (reduce) { text.nodeValue = to; return; }
  const t0 = performance.now();
  (function tick(t) {
    const k = Math.min(1, (t - t0) / 700);
    const e = 1 - Math.pow(1 - k, 3);
    text.nodeValue = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}
steps.forEach((s, i) => s.querySelector(".num").addEventListener("click", () => select(i)));
steps.forEach((s, j) => s.querySelectorAll(".pill").forEach(a => { a.tabIndex = j === 0 ? 0 : -1; a.addEventListener("click", e => e.preventDefault()); }));
cards.forEach(c => c.addEventListener("click", e => { e.preventDefault(); select(species.findIndex(s => c.dataset.href.endsWith("#" + s.id))); }));
document.querySelectorAll(".nav a").forEach(a => a.addEventListener("click", e => e.preventDefault()));

/* ---------- the mark on the crafted card: eight petals and an inner ring ---------- */
{
  const m = document.getElementById("mark"); let d = "";
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const P = (r, o) => [28 + Math.cos(a + o) * r, 28 + Math.sin(a + o) * r].map(n => n.toFixed(2)).join(" ");
    d += `M${P(5, 0)} Q${P(17, .32)} ${P(25, 0)} Q${P(17, -.32)} ${P(5, 0)} `;
  }
  m.innerHTML = `<path d="${d}"/><circle cx="28" cy="28" r="4.2"/><circle cx="28" cy="28" r="1.4"/>`;
}

/* ---------- liquid glass: a displacement map from the card's rounded-rect distance field ---------- */
// rounded edge plus a slow ripple across the body for the "molten" look
function buildMap(w, h, r, phase = 0) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), img = g.createImageData(w, h);
  const bezel = Math.min(w, h) * 0.18, rip = .14;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const px = x - w / 2 + .5, py = y - h / 2 + .5;
      // signed distance to rounded rect (negative inside)
      const qx = Math.abs(px) - (w / 2 - r), qy = Math.abs(py) - (h / 2 - r);
      const outside = Math.hypot(Math.max(qx, 0), Math.max(qy, 0));
      const sd = outside + Math.min(Math.max(qx, qy), 0) - r;
      const d = -sd;                                     // depth inside the edge
      let nx, ny;                                        // outward normal of the nearest edge
      if (qx > 0 && qy > 0) { nx = Math.sign(px) * qx / outside; ny = Math.sign(py) * qy / outside; }
      else if (qx > qy) { nx = Math.sign(px); ny = 0; } else { nx = 0; ny = Math.sign(py); }
      const t = d < bezel ? Math.pow(1 - Math.max(d, 0) / bezel, 2.2) : 0;
      const dx = -nx * t + rip * Math.sin(x / 41 + Math.sin(y / 67) * 2.1 + phase);
      const dy = -ny * t + rip * Math.sin(y / 37 + Math.sin(x / 53) * 1.7 - phase * .8);
      const i = (y * w + x) * 4;
      img.data[i] = 128 + 127 * Math.max(-1, Math.min(1, dx));
      img.data[i + 1] = 128 + 127 * Math.max(-1, Math.min(1, dy));
      img.data[i + 2] = 128; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL();
}
// SVG filters inside backdrop-filter only render in Chromium; everyone else keeps the frosted blur
const liquidOK = !!(navigator.userAgentData && navigator.userAgentData.brands.some(b => /Chromium/.test(b.brand)));
const mapImg = document.getElementById("map-img");
if (liquidOK) {
  frame.classList.add("liquid-ok");
  mapImg.setAttribute("href", buildMap(261, 254, 20));
}

/* ---------- the flower ---------- */
const canvas = document.getElementById("gl");
const R = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
R.toneMapping = T.AgXToneMapping; R.toneMappingExposure = 1.35;
R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = backdrop(1220, 690);
scene.environment = studio(R);
const { flower, head, bloom } = createFlower(SPECIES.dahlia);
scene.add(flower);
const warm = new T.PointLight(0xffd59a, 5, 1.2); warm.position.set(0, .15, 0); head.add(warm);
keyLight(scene, head, { intensity: 3.2 });
flower.position.set(.03, 0, 0);
const cam = new T.PerspectiveCamera(30, 1220 / 690, .01, 50);
cam.position.set(0, Math.sin(.07) * 3.7, Math.cos(.07) * 3.7); cam.lookAt(0, -.15, 0);

function sizeGL() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5) * scale;
  R.setPixelRatio(1); R.setSize(Math.round(1220 * dpr), Math.round(690 * dpr), false);
}

// the page background, drawn into the scene so the glass petals refract it
function backdrop(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  let gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, "#2d4064"); gr.addColorStop(.5, "#3b5079"); gr.addColorStop(1, "#3e4960");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createRadialGradient(w * .5, h * .62, 40, w * .5, h * .62, w * .55);
  gr.addColorStop(0, "rgba(120,145,185,.45)"); gr.addColorStop(1, "rgba(120,145,185,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "rgba(20,30,50,.18)"); gr.addColorStop(.6, "rgba(20,30,50,0)"); gr.addColorStop(1, "rgba(20,30,50,.1)");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace;
  return t;
}

/* ---------- photo cards: the other two species, rendered once by the same engine ---------- */
function portrait(spec, bg, view) {
  const c = document.createElement("canvas");
  const r = new T.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(360, 490, false);
  r.toneMapping = T.AgXToneMapping; r.toneMappingExposure = view.exp || 1.3;
  r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
  const sc = new T.Scene(); sc.background = new T.Color(bg); sc.environment = studio(r, { room: view.room ?? 0x52627e });
  const f = createFlower(spec); f.bloom(1); sc.add(f.flower);
  keyLight(sc, f.head, { intensity: 2.6, size: 1024 });
  f.flower.rotation.set(view.rx || 0, view.ry || 0, view.rz || 0);
  const cm = new T.PerspectiveCamera(view.fov || 30, 360 / 490, .01, 30);
  cm.position.set(...view.pos); cm.lookAt(...view.at);
  r.render(sc, cm);
  const url = c.toDataURL("image/jpeg", .9);
  r.dispose(); r.forceContextLoss?.();
  return url;
}

let started = false;
const start = () => {
  if (started) return;
  started = true;
  document.body.classList.add("is-playing");
};
document.querySelectorAll(".reveal").forEach(el => el.addEventListener("animationend", e => { if (e.target === el && e.animationName === "reveal") el.classList.add("done"); }));

let t0 = 0, visible = true;
function frameLoop(now) {
  if (visible) {
    if (!t0) t0 = now;                               // the clock starts with the first frame, not with page load
    const t = reduce ? 99 : (now - t0) / 1000;
    bloom(Math.min(1, t / 8));                       // eight seconds, bud to full bloom — the reference's bloom.mp4
    head.rotation.y = reduce ? .4 : .4 + t * .045;   // a slow turn so the reflections travel
    head.rotation.z = Math.sin(t * .35) * .015;
    R.render(scene, cam);
    if (!started) start();                           // reveal starts when the first frame is on screen, like 'playing'
  }
  requestAnimationFrame(frameLoop);
}
new IntersectionObserver(([e]) => (visible = e.isIntersecting)).observe(frame);
resize(); addEventListener("resize", resize);
requestAnimationFrame(frameLoop);

// paint the two portraits after the hero is up, so they never delay the first frame
setTimeout(() => {
  cards[0].style.backgroundImage = `url(${portrait(SPECIES.lotus, 0x95a7c2, { pos: [0, .3, 3.0], at: [.1, -.34, 0], rz: -.3, fov: 34 })})`;
  cards[1].style.backgroundImage = `url(${portrait(SPECIES.star, 0x4a76a0, { pos: [.1, 1.05, .75], at: [.18, 0, -.05], fov: 40, room: 0x2d4c74 })})`;
}, reduce ? 0 : 400);

/* ?demo (the lab's recording only): the reference's own clicks — 02, then 03, then back to 01 */
if (/[?&]demo\b/.test(location.search)) {
  let timers = [[5200, 1], [7300, 2], [9400, 0]].map(([at, i]) => setTimeout(() => select(i), at));
  addEventListener("pointerdown", e => { if (e.isTrusted) { timers.forEach(clearTimeout); timers = []; } }, { capture: true, once: true });
}
</script>
</body>
