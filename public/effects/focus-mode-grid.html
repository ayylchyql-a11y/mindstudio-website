<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus mode grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f3f2ee; background-image: linear-gradient(#00000009 1px, transparent 1px), linear-gradient(90deg, #00000009 1px, transparent 1px); background-size: 28px 28px; color: #f5f5f7; overflow: hidden; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .card { width: 320px; border-radius: 28px; background: #0f0f11; padding: 16px 14px 14px; box-shadow: 0 30px 60px -30px #0008, 0 0 0 1px #00000014; position: relative; overflow: hidden; }
  .eyebrow { display: flex; justify-content: space-between; align-items: center; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #8e8e93; }
  .eyebrow b { color: #f5f5f7; font-weight: 600; letter-spacing: .16em; } .eyebrow i { font-style: normal; color: var(--acc, #8e8e93); margin-right: 4px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: #8e8e93; } .foot b { color: #f5f5f7; font-variant-numeric: tabular-nums; }
  .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #00000055; white-space: nowrap; }
  :root { --acc: #b4a7ff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .it { position: relative; aspect-ratio: .78; border-radius: 12px; overflow: hidden; background: #1a1a1d; cursor: pointer; transition: transform 420ms cubic-bezier(.22,.9,.3,1), filter 420ms cubic-bezier(.22,.9,.3,1), box-shadow 420ms; }
  .it img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* one class on the grid switches the whole layer: the picked item grows and brightens; every sibling loses
     saturation, blurs 2px and shrinks 4% — the same 420ms curve on all of them, so it reads as one move */
  .grid.pick .it { filter: saturate(.3) brightness(.7) blur(2px); transform: scale(.96); }
  .grid.pick .it.on { filter: brightness(1.1); transform: scale(1.08); z-index: 2; box-shadow: 0 16px 40px -16px #000, 0 0 0 1.5px var(--acc); }
  .cap { position: absolute; left: 8px; bottom: 6px; font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity 300ms 200ms; } .it.on .cap { opacity: 1; }
</style>
<div class="card">
  <div class="eyebrow"><span><i>●</i><b>Library</b></span><span id="cnt">6 items</span></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span>Focus · one at a time</span><span id="name">—</span></div>
</div>
<div class="hint">Tap a plate · tap again to release</div>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NAMES = ['Concrete Hall', 'Glass Spine', 'Atrium 04', 'Louvered', 'Sky Court', 'Bridge Deck'];
  const grid = document.getElementById('grid'), cnt = document.getElementById('cnt'), name = document.getElementById('name');
  grid.innerHTML = NAMES.map((n, i) => `<div class="it" data-i="${i}"><img src="_plates/${'abcdeg'[i]}.jpg" alt="${n}"><span class="cap">${n}</span></div>`).join('');
  let cur = -1;
  const pick = (i) => { cur = cur === i ? -1 : i; grid.classList.toggle('pick', cur >= 0); [...grid.children].forEach((el, k) => el.classList.toggle('on', k === cur)); cnt.textContent = cur < 0 ? '6 items' : '1 selected'; name.textContent = cur < 0 ? '—' : NAMES[cur]; };
  const demo = reduce ? [] : [setTimeout(() => pick(3), 1000), setTimeout(() => pick(3), 3200), setTimeout(() => pick(1), 4200)];
  grid.addEventListener('click', (e) => { demo.forEach(clearTimeout); const it = e.target.closest('.it'); if (it) pick(+it.dataset.i); });
</script>
