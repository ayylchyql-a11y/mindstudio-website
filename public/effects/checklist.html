<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f4f4f5; color: #111; overflow: hidden; -webkit-font-smoothing: antialiased; --ink: #111114; --ink-rgb: 17, 17, 20; --card: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 224px; height: 100%; }
  .stage { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(60% 50% at 30% 70%, #fbe7ee66, transparent 70%), radial-gradient(50% 40% at 75% 30%, #e6ecfb80, transparent 70%); }
  .stage[data-fill="dark"] { background: #0e0f11; --ink: #f4f4f5; --ink-rgb: 244, 244, 245; --card: #1b1c1f; color: #f4f4f5; }
  /* ── the bench: one panel, two kinds of control ── */
  .bench { border-left: 1px solid #00000010; background: #fff; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .bench h2 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; } .bench h2 small { display: block; margin-top: 2px; font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; color: #8a8a90; font-weight: 500; }
  .bench .grp { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: #a0a0a6; margin-top: 6px; }
  .sw { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #444; }
  .sw .seg { display: inline-flex; padding: 3px; border-radius: 99px; background: #f1f1f3; } .sw .seg button { border: 0; background: transparent; font: 500 11px/1 inherit; color: #8a8a90; padding: 6px 10px; border-radius: 99px; cursor: pointer; } .sw .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px #0000001a; }
  .lv { position: relative; height: 34px; border-radius: 9px; background: #f1f1f3; overflow: hidden; }
  .lv i { position: absolute; inset: 0; width: var(--v); background: #dcdcdf; border-radius: 9px 0 0 9px; pointer-events: none; }
  .lv span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #333; pointer-events: none; } .lv b { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lv input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: ew-resize; }
  .credit { margin-top: auto; font-size: 8.5px; line-height: 1.4; color: #a0a0a6; } .credit a { color: inherit; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #00000055; } .stage[data-fill="dark"] .hint { color: #ffffff55; }
  /* a 500px card in the library grid keeps the bench beside the stage, just narrower; only phones stack it */
  @media (max-width: 600px) { .wrap { grid-template-columns: 1fr 172px; } .bench { padding: 12px 10px; gap: 8px; } .sw .seg button { padding: 5px 8px; } .lv { height: 30px; } }
  @media (max-width: 420px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .bench { border-left: 0; border-top: 1px solid #00000010; max-height: 46%; } }


  /* ── Checklist ── ONE SPRING PER ROW, and everything is read off it: the box
     filling (raw, may overshoot), the tick drawing (clamped), the rule crossing
     the words (a window on the same number). Finishing the list takes the floor
     out from under it. */
  .cl { width: 240px; padding: 8px; overflow: hidden; border-radius: var(--r, 18px); background: var(--card); box-shadow: 0 1px 2px #0000000a, 0 10px 26px -18px #00000050; border: 1px solid transparent; }
  .stage[data-stroke="on"] .cl { border-color: rgba(var(--ink-rgb), .14); } .stage[data-fill="dark"] .cl { background: #1b1c1f; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 8px; cursor: pointer; user-select: none; color: var(--ink); font-size: 13px; will-change: transform; }
  .box { position: relative; width: var(--b, 18px); height: var(--b, 18px); border-radius: 5px; border: 1.5px solid rgba(var(--ink-rgb), .3); flex: none; }
  .box i { position: absolute; inset: -1.5px; border-radius: 5px; background: var(--ink); transform: scale(var(--t, 0)); }
  .box svg { position: absolute; inset: -1.5px; width: calc(100% + 3px); height: calc(100% + 3px); }
  .box path { fill: none; stroke: var(--card); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .word { position: relative; } .word::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--ink); transform: scaleX(var(--cut, 0)); transform-origin: left; }
  .row.dim .word { color: rgba(var(--ink-rgb), .45); }

</style>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="cl" id="cl"></div>
    <div class="hint">Tick them all</div>
  </div>
  <aside class="bench" id="bench"></aside>
</div>
<script>
  /* ── the bench: a tiny control panel, one function ──
     specs: { key, label, type: 'seg' | 'level', opts?, min?, max?, step?, unit?, value }
     onChange(state) runs on every change with the whole state. */
  function bench(root, title, kind, specs, onChange) {
    const state = Object.fromEntries(specs.map((s) => [s.key, s.value]));
    root.innerHTML = `<h2>${title}<small>${kind}</small></h2>`;
    let lastType = '';
    for (const s of specs) {
      if (s.type !== lastType) { root.insertAdjacentHTML('beforeend', `<div class="grp">${s.type === 'seg' ? 'Switches' : 'Levels'}</div>`); lastType = s.type; }
      if (s.type === 'seg') {
        const el = document.createElement('div'); el.className = 'sw';
        el.innerHTML = `<span>${s.label}</span><span class="seg">${s.opts.map((o) => `<button type="button" class="${o === s.value ? 'on' : ''}" data-o="${o}">${o}</button>`).join('')}</span>`;
        el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); state[s.key] = isNaN(+b.dataset.o) ? b.dataset.o : +b.dataset.o; onChange(state, s.key); });
        root.appendChild(el);
      } else {
        const el = document.createElement('label'); el.className = 'lv';
        const pct = (v) => ((v - s.min) / (s.max - s.min) * 100).toFixed(1) + '%';
        el.innerHTML = `<i style="--v:${pct(s.value)}"></i><span>${s.label}</span><b>${s.value}${s.unit || ''}</b><input type="range" min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${s.value}">`;
        el.querySelector('input').addEventListener('input', (e) => { const v = +e.target.value; state[s.key] = v; el.querySelector('i').style.setProperty('--v', pct(v)); el.querySelector('b').textContent = v + (s.unit || ''); onChange(state, s.key); });
        root.appendChild(el);
      }
    }
    root.insertAdjacentHTML('beforeend', `<div class="credit">Rebuilt from <a href="https://bencho.dev" target="_blank" rel="noopener">Bencho</a> by Lorenzo Cabra · block logic MIT © 2026 Lorenzo Cabra</div>`);
    onChange(state, null);
    return state;
  }


  const cl = document.getElementById('cl'), stage = document.getElementById('stage');
  const TASKS = ['Book the studio', 'Send the estimate', 'Pick a typeface', 'Add new task'];
  let P = {}, rows = [], fellAt = 0;
  TASKS.forEach((txt, i) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = `<span class="box"><i></i><svg viewBox="0 0 24 24"><path d="M6 12.4 L10.3 16.7 L18 7.6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></span><span class="word">${txt}</span>`; cl.appendChild(r);
    const s = { el: r, on: false, t: 0, v: 0, y: 0, vy: 0, rot: 0 }; r.addEventListener('click', () => { s.on = !s.on; wake(); }); rows.push(s); });
  let raf = 0, last = 0;
  function frame(now) {
    const dt = Math.min(.04, (now - last) / 1000); last = now; let busy = false;
    const k = 300, d = 2 * Math.sqrt(k) * (1 - 0.6 * P.bounce / 100);       // Bounce is how far the box swells past full
    const fell = rows.every((s) => s.on); if (fell && !fellAt) fellAt = now; if (!fell) fellAt = 0;
    rows.forEach((s, i) => {
      s.v += (-k * (s.t - (s.on ? 1 : 0)) - d * s.v) * dt; s.t += s.v * dt; if (Math.abs(s.v) > .001 || Math.abs(s.t - (s.on ? 1 : 0)) > .001) busy = true;
      const raw = s.t, cl1 = Math.max(0, Math.min(1, s.t)), cut = Math.max(0, Math.min(1, (s.t - 0.12) / 0.72));
      s.el.querySelector('.box i').style.setProperty('--t', raw.toFixed(3)); s.el.querySelector('path').setAttribute('stroke-dashoffset', (1 - cl1).toFixed(3)); s.el.querySelector('.word').style.setProperty('--cut', cut.toFixed(3)); s.el.classList.toggle('dim', cut > 0.5);
      /* the fall: bottom row first, 45ms apart — a stack collapsing from underneath; coming back is a spring */
      let ty = 0, rot = 0;
      if (fell) { const wait = (rows.length - 1 - i) * 0.045, el = Math.max(0, (now - fellAt) / 1000 - wait), drop = cl.clientHeight, u = Math.min(1, el / 0.62); const easeIn = (x) => x * x; ty = u < .66 ? drop * easeIn(u / .66) : u < .84 ? drop - 9 * Math.sin((u - .66) / .18 * Math.PI) : drop; rot = (i % 2 ? 1 : -1) * 4 * Math.min(1, u * 2); if (u < 1) busy = true; s.y = ty; s.rot = rot; }
      else { const kk = 420, dd = 26; s.vy += (-kk * s.y - dd * s.vy) * dt; s.y += s.vy * dt; s.rot *= 0.85; if (Math.abs(s.y) > .1) busy = true; }
      s.el.style.transform = `translateY(${s.y.toFixed(2)}px) rotate(${s.rot.toFixed(2)}deg)`;
    });
    if (fell) busy = true;                                                                    // keep the clock running while it lies on the floor
    if (fell && now - fellAt > 3000) { rows.forEach((s) => s.on = false); }                  // three seconds later the list is handed back
    if (busy) raf = requestAnimationFrame(frame); else raf = 0;
  }
  const wake = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  bench(document.getElementById('bench'), 'Checklist', 'Press', [
    { key: 'fill', label: 'Fill', type: 'seg', opts: ['Light', 'Dark'], value: 'Light' },
    { key: 'stroke', label: 'Stroke', type: 'seg', opts: ['Off', 'On'], value: 'Off' },
    { key: 'bounce', label: 'Bounce', type: 'level', min: 0, max: 100, step: 5, value: 50 },
    { key: 'corner', label: 'Corner', type: 'level', min: 0, max: 40, step: 2, value: 18, unit: 'px' },
    { key: 'box', label: 'Box', type: 'level', min: 14, max: 28, value: 18, unit: 'px' },
  ], (state) => { P = state; stage.dataset.fill = state.fill.toLowerCase(); stage.dataset.stroke = state.stroke.toLowerCase(); cl.style.setProperty('--r', state.corner + 'px'); cl.style.setProperty('--b', state.box + 'px'); });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) [0, 1, 2, 3].forEach((i) => setTimeout(() => { rows[i].on = true; wake(); }, 900 + i * 650));

</script>
