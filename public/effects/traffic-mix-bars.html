<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic mix · 流量占比条</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0a0a0c; display: grid; place-items: center; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4f4f6;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }

  /* Laid out at a fixed 470 × 470 and scaled to fit, so every number below is in card pixels. */
  .fit { width: calc(470px * var(--k, 1)); height: calc(470px * var(--k, 1)); }
  .card { position: relative; width: 470px; height: 470px; transform: scale(var(--k, 1)); transform-origin: 0 0;
    border-radius: 28px; background: linear-gradient(135deg, #131419, #0f1014 70%); border: 1px solid #ffffff0d; overflow: hidden; }

  .kicker { position: absolute; left: 32px; top: 29px; display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; letter-spacing: .125em; text-transform: uppercase; color: #ff7f97; }
  .kicker i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .live { position: absolute; right: 34px; top: 30px; font-size: 11.5px; letter-spacing: .16em; color: #6c6c70; }
  .num { position: absolute; left: 32px; top: 71px; display: flex; align-items: baseline; gap: 13px; }
  .num b { font-size: 54px; font-weight: 300; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
  .num span { position: relative; top: -3px; font-size: 12.5px; color: #a9a9ae; }
  .tag { position: absolute; right: 34px; top: 87px; font-size: 12.5px; letter-spacing: .03em; color: #ff7f97; }

  .mix { position: absolute; left: 0; top: 0; width: 470px; height: 345px; cursor: pointer; }
  .row { position: absolute; left: 77px; width: 317px; height: 60px; }
  .row i { position: absolute; left: 2px; top: 6px; width: 8px; height: 8px; border-radius: 50%; }
  .row span { position: absolute; left: 23px; top: -1px; font-size: 15px; color: #e6e6ea; }
  .row b { position: absolute; right: 3px; top: -5px; font-size: 18.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .track { position: absolute; left: 0; top: 32px; width: 317px; height: 15px; border-radius: 7.5px; background: #222228; overflow: hidden; }
  .fill { height: 100%; border-radius: 7.5px; will-change: width; }
  .caption { position: absolute; left: 77px; top: 369px; font-size: 11px; letter-spacing: .1em; color: #8c8c92; }

  .rule { position: absolute; left: 34px; right: 34px; top: 390px; height: 1px; background: #ffffff14; }
  .foot { position: absolute; left: 34px; right: 34px; top: 409px; display: flex; justify-content: space-between; font-size: 13px; color: #b3b3b8; }
  .foot span:last-child { font-size: 11.5px; letter-spacing: .03em; color: #a5a5aa; }
</style>
</head>
<body>
<div class="fit">
  <div class="card" id="card">
    <div class="kicker"><i></i>06 / Traffic mix</div>
    <div class="live">LIVE LOOP</div>
    <div class="num"><b id="total">240</b><span>requests / s</span></div>
    <div class="tag">LIVE SHARE</div>
    <div class="mix" id="mix" role="button" aria-label="Remix the sources"></div>
    <div class="caption">PROPORTION OF TOTAL TRAFFIC</div>
    <div class="rule"></div>
    <div class="foot"><span id="status">Traffic mix updated</span><span>TAP TO REMIX ↗</span></div>
  </div>
</div>
<script>
(() => {
  const SOURCES = [["Direct", "#ff7a93"], ["Search", "#3dc7c0"], ["Referral", "#a98cf6"]];
  const A = { total: 240, share: [28, 49, 23] };     // the busy mix
  const B = { total: 80,  share: [48, 32, 20] };     // the quiet mix
  // The loop (seconds), read off the reference: A → B together in 1.6 s; the total climbs back
  // over 3.35 s while the shares wait, then they slide back to A over 3 s; hold A.
  const AB = 1.6, TOTAL_AT = 1.72, BACK_TOTAL = 3.35, SHARE_AT = 3.0, BACK_SHARE = 3.0, SETTLED = 6.0, CYCLE = 8.25;
  const IDLE = 4000;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const sine = (x) => (1 - Math.cos(Math.PI * clamp(x))) / 2;
  const mixOf = (a, b, k) => ({ total: a.total + (b.total - a.total) * k, share: a.share.map((v, i) => v + (b.share[i] - v) * k) });

  const mix = $("mix"), total = $("total"), status = $("status");
  const rows = SOURCES.map(([name, col], i) => {
    const r = document.createElement("div");
    r.className = "row"; r.style.top = 141 + i * 73 + "px";
    r.innerHTML = `<i style="background:${col}"></i><span>${name}</span><b style="color:${col}"></b><div class="track"><div class="fill" style="background:${col}"></div></div>`;
    mix.appendChild(r);
    return { pct: r.querySelector("b"), fill: r.querySelector(".fill"), last: "" };
  });

  // Whole percentages that always add up to 100 (largest remainder), however the shares are mid-flight.
  function whole(share) {
    const sum = share.reduce((a, b) => a + b, 0), raw = share.map((v) => v / sum * 100);
    const out = raw.map(Math.floor);
    raw.map((v, i) => [v - out[i], i]).sort((a, b) => b[0] - a[0]).slice(0, 100 - out.reduce((a, b) => a + b, 0)).forEach(([, i]) => out[i]++);
    return out;
  }
  function draw(m, settled) {
    const sum = m.share.reduce((a, b) => a + b, 0), pct = whole(m.share);
    rows.forEach((r, i) => {
      r.fill.style.width = (m.share[i] / sum * 100).toFixed(3) + "%";
      const t = pct[i] + "%";
      if (t !== r.last) { r.pct.textContent = t; r.last = t; }
    });
    const t = String(Math.round(m.total));
    if (total.textContent !== t) total.textContent = t;
    const s = settled ? "Traffic mix updated" : "Balancing three sources";
    if (status.textContent !== s) status.textContent = s;
  }

  let from = A, t0 = null, manual = null, cur = A;
  function loopAt(tau) {
    if (tau < AB) return { m: mixOf(from, B, sine(tau / AB)), settled: false };
    const k = sine((tau - TOTAL_AT) / BACK_TOTAL), j = sine((tau - SHARE_AT) / BACK_SHARE);
    return { m: { total: B.total + (A.total - B.total) * k, share: B.share.map((v, i) => v + (A.share[i] - v) * j) }, settled: tau >= SETTLED };
  }

  function frame(now) {
    if (t0 === null) t0 = now - SETTLED * 1000;             // open on the settled mix
    if (manual) {
      const k = sine((now - manual.at) / 1000 / AB);
      cur = mixOf(manual.a, manual.b, k);
      draw(cur, k >= 1);
      if (now - manual.at > AB * 1000 + IDLE) { from = cur; manual = null; t0 = now; }
    } else {
      let tau = (now - t0) / 1000;
      if (tau >= CYCLE) { t0 += CYCLE * 1000; tau -= CYCLE; from = A; }
      const s = loopAt(tau); cur = s.m; draw(cur, s.settled);
    }
    requestAnimationFrame(frame);
  }

  // TAP TO REMIX: three new shares (each 12–60 %) and a new total, from wherever the bars are now.
  mix.addEventListener("click", () => {
    let s; do { const a = 12 + Math.random() * 48, b = 12 + Math.random() * 48; s = [a, b, 100 - a - b]; } while (s[2] < 12 || s[2] > 60);
    const next = { total: 60 + Math.round(Math.random() * 240), share: whole(s) };
    if (reduce) { cur = next; return draw(next, true); }
    manual = { at: performance.now(), a: cur, b: next };
  });

  if (reduce) draw(A, true);
  else requestAnimationFrame(frame);

  const fit = () => document.documentElement.style.setProperty("--k", Math.min(1, (innerWidth - 24) / 470, (innerHeight - 24) / 470));
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
