<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M Desk · Binario + pannello</title>
<meta name="description" content="Back office di un ristorante, design 04: un binario di icone da 72 px e un pannello di secondo livello da 240 px.">
<link rel="stylesheet" href="../_mdesk/core.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Moduli"><span class="logo">M</span><nav id="railnav"></nav><span class="avatar">A</span></aside>
  <aside class="panel" id="panel" aria-label="Sezioni"><h2 id="ptitle">Panoramica</h2><nav id="sub"></nav><a class="back" href="/lab/dashboard" target="_top">← Altri design</a></aside>
  <main class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Apri il menu" type="button">☰</button>
      <h1 id="title">Panoramica</h1>
      <span class="chip"><i></i>Normale</span>
      <span class="chip on">⚡ Auto-conferma ON</span>
      <span class="chip">⏱ 912203</span>
      <span class="chip warn"><i></i>Pausa ordini</span>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<script src="../_mdesk/data.js"></script>
<script src="../_mdesk/core.js"></script>
<script src="app.js"></script>
