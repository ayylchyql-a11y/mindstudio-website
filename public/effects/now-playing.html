<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now playing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f4f4f5; color: #111; overflow: hidden; -webkit-font-smoothing: antialiased; --ink: #111114; --ink-rgb: 17, 17, 20; --card: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 224px; height: 100%; }
  .stage { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(60% 50% at 30% 70%, #fbe7ee66, transparent 70%), radial-gradient(50% 40% at 75% 30%, #e6ecfb80, transparent 70%); }
  .stage[data-fill="dark"] { background: #0e0f11; --ink: #f4f4f5; --ink-rgb: 244, 244, 245; --card: #1b1c1f; color: #f4f4f5; }
  /* ── the bench: one panel, two kinds of control ── */
  .bench { border-left: 1px solid #00000010; background: #fff; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .bench h2 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; } .bench h2 small { display: block; margin-top: 2px; font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase; color: #8a8a90; font-weight: 500; }
  .bench .grp { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: #a0a0a6; margin-top: 6px; }
  .sw { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #444; }
  .sw .seg { display: inline-flex; padding: 3px; border-radius: 99px; background: #f1f1f3; } .sw .seg button { border: 0; background: transparent; font: 500 11px/1 inherit; color: #8a8a90; padding: 6px 10px; border-radius: 99px; cursor: pointer; } .sw .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px #0000001a; }
  .lv { position: relative; height: 34px; border-radius: 9px; background: #f1f1f3; overflow: hidden; }
  .lv i { position: absolute; inset: 0; width: var(--v); background: #dcdcdf; border-radius: 9px 0 0 9px; pointer-events: none; }
  .lv span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #333; pointer-events: none; } .lv b { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lv input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: ew-resize; }
  .credit { margin-top: auto; font-size: 8.5px; line-height: 1.4; color: #a0a0a6; } .credit a { color: inherit; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #00000055; } .stage[data-fill="dark"] .hint { color: #ffffff55; }
  /* a 500px card in the library grid keeps the bench beside the stage, just narrower; only phones stack it */
  @media (max-width: 600px) { .wrap { grid-template-columns: 1fr 172px; } .bench { padding: 12px 10px; gap: 8px; } .sw .seg button { padding: 5px 8px; } .lv { height: 30px; } }
  @media (max-width: 420px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .bench { border-left: 0; border-top: 1px solid #00000010; max-height: 46%; } }


  /* ── Now playing ── ONE NUMBER IS THE STATE: a single tween 0 → 1 and every
     position, size, radius and type size is a mix() of its two ends. Eased,
     not sprung, because a spring past the target drags the corner with it.
     The cover is the hinge: it grows in place and never leaves its corner. */
  .np { position: relative; width: 250px; height: 200px; display: grid; place-items: start center; }
  .box { position: relative; width: 250px; background: var(--card); box-shadow: 0 1px 2px #0000000a, 0 10px 26px -18px #00000050; border: 1px solid transparent; color: var(--ink); overflow: hidden; cursor: pointer; will-change: height, transform; }
  .stage[data-stroke="on"] .box { border-color: rgba(var(--ink-rgb), .14); } .stage[data-fill="dark"] .box { background: #1b1c1f; }
  .cover { position: absolute; left: 10px; top: 10px; background: linear-gradient(160deg, #e9c33b, #e9773a 45%, #3b7ddc 80%); }
  .meta { position: absolute; left: 62px; top: 14px; } .meta b { display: block; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; } .meta small { display: block; color: rgba(var(--ink-rgb), .5); margin-top: 2px; }
  .ctl { position: absolute; display: flex; align-items: center; gap: 14px; }
  .ctl i { font-style: normal; font-size: 14px; color: rgba(var(--ink-rgb), .6); }
  .play { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .play svg { width: 16px; height: 16px; } .play polygon { fill: var(--card); }
  .track { position: absolute; left: 10px; right: 10px; height: 3px; border-radius: 2px; background: rgba(var(--ink-rgb), .12); } .track i { display: block; height: 100%; width: 24%; border-radius: 2px; background: var(--ink); }
  .times { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 10px; color: rgba(var(--ink-rgb), .5); font-variant-numeric: tabular-nums; }

</style>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="np"><div class="box" id="box"><span class="cover" id="cover"></span><div class="meta" id="meta"><b>Cabra Field</b><small>Side B</small></div><div class="ctl" id="ctl"><i>⏮</i><span class="play" id="play"><svg viewBox="0 0 24 24"><polygon id="pl"/><polygon id="pr"/></svg></span><i>⏭</i></div><div class="track" id="track"><i></i></div><div class="times" id="times"><span>0:52</span><span>−2:42</span></div></div></div>
    <div class="hint">Tap the bar to open · tap play</div>
  </div>
  <aside class="bench" id="bench"></aside>
</div>
<script>
  /* ── the bench: a tiny control panel, one function ──
     specs: { key, label, type: 'seg' | 'level', opts?, min?, max?, step?, unit?, value }
     onChange(state) runs on every change with the whole state. */
  function bench(root, title, kind, specs, onChange) {
    const state = Object.fromEntries(specs.map((s) => [s.key, s.value]));
    root.innerHTML = `<h2>${title}<small>${kind}</small></h2>`;
    let lastType = '';
    for (const s of specs) {
      if (s.type !== lastType) { root.insertAdjacentHTML('beforeend', `<div class="grp">${s.type === 'seg' ? 'Switches' : 'Levels'}</div>`); lastType = s.type; }
      if (s.type === 'seg') {
        const el = document.createElement('div'); el.className = 'sw';
        el.innerHTML = `<span>${s.label}</span><span class="seg">${s.opts.map((o) => `<button type="button" class="${o === s.value ? 'on' : ''}" data-o="${o}">${o}</button>`).join('')}</span>`;
        el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); state[s.key] = isNaN(+b.dataset.o) ? b.dataset.o : +b.dataset.o; onChange(state, s.key); });
        root.appendChild(el);
      } else {
        const el = document.createElement('label'); el.className = 'lv';
        const pct = (v) => ((v - s.min) / (s.max - s.min) * 100).toFixed(1) + '%';
        el.innerHTML = `<i style="--v:${pct(s.value)}"></i><span>${s.label}</span><b>${s.value}${s.unit || ''}</b><input type="range" min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${s.value}">`;
        el.querySelector('input').addEventListener('input', (e) => { const v = +e.target.value; state[s.key] = v; el.querySelector('i').style.setProperty('--v', pct(v)); el.querySelector('b').textContent = v + (s.unit || ''); onChange(state, s.key); });
        root.appendChild(el);
      }
    }
    root.insertAdjacentHTML('beforeend', `<div class="credit">Rebuilt from <a href="https://bencho.dev" target="_blank" rel="noopener">Bencho</a> by Lorenzo Cabra · block logic MIT © 2026 Lorenzo Cabra</div>`);
    onChange(state, null);
    return state;
  }


  const box = document.getElementById('box'), cover = document.getElementById('cover'), meta = document.getElementById('meta'), ctl = document.getElementById('ctl'), track = document.getElementById('track'), times = document.getElementById('times'), stage = document.getElementById('stage'), pl = document.getElementById('pl'), pr = document.getElementById('pr');
  let P = {}, open = false, playing = false, p = 0, u = 0, from = 0, t0 = 0, dur = 600, g = 0, gT = 0, dir = 1;
  const mix = (a, b, t) => a + (b - a) * t, clamp = (v) => Math.max(0, Math.min(1, v));
  /* the play mark is DRAWN, not swapped: the same two quadrilaterals, eight points moving */
  const PAUSE_L = [6, 4, 10, 4, 10, 20, 6, 20], PLAY_L = [6.5, 4, 13.25, 8, 13.25, 16, 6.5, 20], PAUSE_R = [14, 4, 18, 4, 18, 20, 14, 20], PLAY_R = [13.25, 8, 19.5, 12, 19.5, 12, 13.25, 16];
  const pts = (a, b, t) => a.map((v, i) => mix(v, b[i], t).toFixed(2)).reduce((s, v, i) => s + (i % 2 ? ' ' + v + (i < 7 ? ',' : '') : v), '');
  function paint(now) {
    const PAD = 10, CORNER = 16, corner = P.corner;
    const e = 1 - Math.pow(1 - p, 4);                                        // quart-out: quick off the mark, never past the number
    const late = clamp((e - 0.6) / 0.4);
    const artR = [corner * 40 / 64, corner], off = PAD * Math.min(1, corner / CORNER);   // the box is derived from the sleeve: concentric at every value
    const size = mix(40, 64, e), h = mix(78, 189, e);
    box.style.height = h + 'px'; box.style.borderRadius = mix(artR[0] + off, artR[1] + off, e) + 'px';
    cover.style.width = cover.style.height = size + 'px'; cover.style.borderRadius = mix(artR[0], artR[1], e) + 'px';
    meta.style.left = mix(62, 86, e) + 'px'; meta.style.top = mix(14, 24, e) + 'px'; meta.querySelector('b').style.fontSize = mix(13, 16, e) + 'px'; meta.querySelector('small').style.fontSize = mix(11, 12, e) + 'px';
    ctl.style.left = mix(148, 88, e) + 'px'; ctl.style.top = mix(23, 130, e) + 'px';
    track.style.top = mix(66, 100, e) + 'px'; times.style.top = mix(60, 108, e) + 'px'; times.style.opacity = late;
    /* the bounce is a second number and it only scales — on the close only */
    const swell = Math.sin(Math.PI * Math.pow(clamp(u), 1.5)); box.style.transform = open ? '' : `scale(${(1 - 0.035 * swell).toFixed(4)})`;
    /* the goo is zero at both ends: a bulge on the way */
    const goo = Math.sin(clamp(g) * Math.PI); pl.setAttribute('points', pts(playing ? PAUSE_L : PLAY_L, playing ? PLAY_L : PAUSE_L, 1 - g)); pr.setAttribute('points', pts(playing ? PAUSE_R : PLAY_R, playing ? PLAY_R : PAUSE_R, 1 - g));
    document.querySelector('.play svg').style.transform = `rotate(${9 * goo * dir}deg) scale(${1 - 0.13 * goo}, ${1 + 0.11 * goo})`;
  }
  let raf = 0, lastT = 0;
  function frame(now) { const dt = (now - lastT) / 1000; lastT = now; const tgt = open ? 1 : 0; p += Math.sign(tgt - p) * Math.min(Math.abs(tgt - p), dt / (dur / 1000)); u += Math.sign(tgt - u) * Math.min(Math.abs(tgt - u), dt / (dur / 1000)); g += Math.min(1 - g, dt / 0.42); paint(now); if (p !== tgt || u !== tgt || g < 1) raf = requestAnimationFrame(frame); else raf = 0; }
  const wake = () => { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } };
  box.addEventListener('click', (e) => { if (e.target.closest('.play')) { playing = !playing; dir = playing ? 1 : -1; g = 0; wake(); return; } open = !open; wake(); });
  bench(document.getElementById('bench'), 'Now playing', 'Press', [
    { key: 'fill', label: 'Fill', type: 'seg', opts: ['Light', 'Dark'], value: 'Light' },
    { key: 'stroke', label: 'Stroke', type: 'seg', opts: ['Off', 'On'], value: 'Off' },
    { key: 'morph', label: 'Morph', type: 'level', min: 0, max: 100, step: 5, value: 50 },
    { key: 'corner', label: 'Corner', type: 'level', min: 0, max: 32, step: 2, value: 16 },
  ], (state) => { P = state; stage.dataset.fill = state.fill.toLowerCase(); stage.dataset.stroke = state.stroke.toLowerCase(); dur = 900 - state.morph * 6; g = 1; paint(performance.now()); });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { setTimeout(() => { open = true; wake(); }, 1000); setTimeout(() => { playing = true; g = 0; wake(); }, 2000); setTimeout(() => { open = false; wake(); }, 3400); }

</script>
